const DATA = {"total":685.827,"chapters":[{"id":"intro","n":0,"title":"The MapReduce Model","zh":"MapReduce 模型","t":0},{"id":"idea","n":1,"title":"The Whole Idea First","zh":"先说结论","t":28.596},{"id":"comment","n":2,"title":"The Comment That Starts It","zh":"一句注释","t":98.688},{"id":"grid","n":3,"title":"Where M and R Come From","zh":"M 和 R 从哪来","t":131.909},{"id":"rule","n":4,"title":"A Rule That Picks a Bucket","zh":"选桶的规则","t":175.357},{"id":"ihash","n":5,"title":"ihash, by Hand","zh":"手算 ihash","t":262.614},{"id":"column","n":6,"title":"Same Word, Same Column","zh":"同一个词，同一列","t":332.758},{"id":"sofar","n":7,"title":"So Far, on the Page","zh":"小结（在图上）","t":370.152},{"id":"wait","n":8,"title":"The Gate: Reduce Must Wait","zh":"闸门：Reduce 必须等","t":392.173},{"id":"group","n":9,"title":"Sort, Then Group","zh":"先排序，再归组","t":426.525},{"id":"reduce","n":10,"title":"Reduce Reads a Column","zh":"Reduce 读一整列","t":458.442},{"id":"evidence","n":11,"title":"The Real Run: 80 Files","zh":"真实运行：80 个文件","t":502.759},{"id":"test","n":12,"title":"How the Test Judges It","zh":"测试怎么判对错","t":550.525},{"id":"limits","n":13,"title":"What This Episode Skipped","zh":"这一集没讲的","t":595.362},{"id":"recap","n":14,"title":"Recap, on the Page","zh":"本集要点（在图上）","t":629.453},{"id":"turn","n":15,"title":"Your Turn","zh":"轮到你","t":654.953}],"slides":[{"scene":"intro","ch":0,"title":"The MapReduce Model","zh":"MapReduce 模型","t":0.9,"lines":[["Episode 2: the MapReduce model.","第 2 集：MapReduce 模型。"],["Last time, mrsequential put every pair from eight books into one slice in memory.","上一集，mrsequential 把八本书的所有词对放进了内存里的同一个切片。"]],"img":"slides/001.jpg"},{"scene":"intro","ch":0,"title":"The MapReduce Model","zh":"MapReduce 模型","t":12.59,"lines":[["On many machines there is no \"one slice\": each machine has only its own memory.","换成很多台机器，就没有“同一个切片”了：每台机器只有自己的内存。"]],"img":"slides/002.jpg"},{"scene":"intro","ch":0,"title":"The MapReduce Model","zh":"MapReduce 模型","t":20.31,"lines":[["Today: how the pairs are cut up so many machines can share the work.","今天讲：词对怎么切开，让很多台机器分着做。"]],"img":"slides/003.jpg"},{"scene":"idea","ch":1,"title":"The Whole Idea First","zh":"先说结论","t":29.5,"lines":[["Here is the whole episode in two sentences.","先用两句话说完这一集。"]],"img":"slides/004.jpg"},{"scene":"idea","ch":1,"title":"The Whole Idea First","zh":"先说结论","t":34.17,"lines":[["Every pair from book X goes into file mr-X-Y, where Y is the word's hash, mod 10.","第 X 本书的每个词对，都进文件 mr-X-Y；Y 是这个词的哈希值对 10 取余。"],["When every book is done, reducer Y reads column Y: every copy of its words, and nobody else's.","等所有书都做完，第 Y 个 reducer 读第 Y 列：它那些词的全部副本，别人的一个也没有。"],["Now the page, top to bottom. A: eight books, so eight map tasks, one row each.","下面是这张图，从上往下。A：八本书，就是八个 map 任务，一本一行。"]],"img":"slides/005.jpg"},{"scene":"idea","ch":1,"title":"The Whole Idea First","zh":"先说结论","t":59.95,"lines":[["B: Map turns a book into pairs, one per word: the word and \"1\".","B：Map 把一本书变成词对，每个词一对：这个词，和 \"1\"。"]],"img":"slides/006.jpg"},{"scene":"idea","ch":1,"title":"The Whole Idea First","zh":"先说结论","t":67.23,"lines":[["C: each pair picks its column with ihash, mod 10, and is appended to mr-X-Y.","C：每个词对用 ihash 对 10 取余选出它的列，追加进 mr-X-Y。"]],"img":"slides/007.jpg"},{"scene":"idea","ch":1,"title":"The Whole Idea First","zh":"先说结论","t":74.96,"lines":[["D: a gate. Reduce may start only when all eight map tasks have finished.","D：一道闸。所有八个 map 任务都完成，reduce 才能开始。"]],"img":"slides/008.jpg"},{"scene":"idea","ch":1,"title":"The Whole Idea First","zh":"先说结论","t":82.24,"lines":[["E: reducer Y reads its column, sorts it, groups equal words, and writes mr-out-Y.","E：第 Y 个 reducer 读它那一列，排序，把相同的词归到一起，写出 mr-out-Y。"]],"img":"slides/009.jpg"},{"scene":"idea","ch":1,"title":"The Whole Idea First","zh":"先说结论","t":89.53,"lines":[["We'll follow one word down this page: \"of\". Its path will light up as we go.","我们跟着一个词 \"of\" 从上走到下。它走过的地方会一路亮起来。"]],"img":"slides/010.jpg"},{"scene":"comment","ch":2,"title":"The Comment That Starts It","zh":"一句注释","t":99.59,"lines":[["mrsequential admits the difference in a comment, right after the map loop.","mrsequential 在 map 循环后面的注释里自己说了区别。"]],"img":"slides/011.jpg"},{"scene":"comment","ch":2,"title":"The Comment That Starts It","zh":"一句注释","t":106,"lines":[["All the intermediate data sits in one place, rather than being partitioned into N by M buckets.","所有中间数据都放在一个地方，而不是分进 N×M 个桶。"]],"img":"slides/012.jpg"},{"scene":"comment","ch":2,"title":"The Comment That Starts It","zh":"一句注释","t":114.6,"lines":[["\"Intermediate data\" means the pairs: Map's output, before Reduce has seen them.","“中间数据”就是那些词对：Map 的输出，还没交给 Reduce 的东西。"]],"img":"slides/013.jpg"},{"scene":"comment","ch":2,"title":"The Comment That Starts It","zh":"一句注释","t":121.01,"lines":[["So the pairs are cut twice: once by which book they came from, once by which bucket they go to.","所以词对要切两刀：按来自哪本书切一次，按去哪个桶再切一次。"]],"img":"slides/014.jpg"},{"scene":"grid","ch":3,"title":"Where M and R Come From","zh":"M 和 R 从哪来","t":132.81,"lines":[["The first cut is free: one map task per input file. Eight books, so M is 8.","第一刀是现成的：每个输入文件一个 map 任务。八本书，M 就是 8。"],["A \"task\" is one piece of work a machine can be handed on its own.","“任务”就是能单独交给一台机器去做的一份活。"]],"img":"slides/015.jpg"},{"scene":"grid","ch":3,"title":"Where M and R Come From","zh":"M 和 R 从哪来","t":149.12,"lines":[["The second number is nReduce, the number of reduce tasks. Where does it come from?","第二个数是 nReduce，也就是 reduce 任务的个数。它从哪来？"]],"img":"slides/016.jpg"},{"scene":"grid","ch":3,"title":"Where M and R Come From","zh":"M 和 R 从哪来","t":156.84,"lines":[["mrcoordinator.go hard-codes it: MakeCoordinator gets 10, every run.","mrcoordinator.go 写死了：每次都给 MakeCoordinator 传 10。"]],"img":"slides/017.jpg"},{"scene":"grid","ch":3,"title":"Where M and R Come From","zh":"M 和 R 从哪来","t":161.52,"lines":[["Eight rows times ten columns: eighty intermediate files.","八行乘十列：八十个中间文件。"]],"img":"slides/018.jpg"},{"scene":"grid","ch":3,"title":"Where M and R Come From","zh":"M 和 R 从哪来","t":166.2,"lines":[["The lab suggests naming them mr-X-Y: X is the map task, Y is the reduce bucket.","Lab 建议把它们命名为 mr-X-Y：X 是 map 任务，Y 是 reduce 桶。"]],"img":"slides/019.jpg"},{"scene":"rule","ch":4,"title":"A Rule That Picks a Bucket","zh":"选桶的规则","t":176.26,"lines":[["Each pair must land in exactly one bucket. We need a rule. Let's try one on a toy.","每个词对必须进恰好一个桶。我们需要一条规则，先拿玩具例子试试。"],["Six words, three buckets: sea, see, sun, sky, sand, cat.","六个词，三个桶：sea、see、sun、sky、sand、cat。"],["Rule one: by first letter. a–h go to bucket 0, i–r to 1, s–z to 2.","规则一：按首字母。a 到 h 进 0 号桶，i 到 r 进 1 号，s 到 z 进 2 号。"],["How full is each bucket?","每个桶有多满？"]],"img":"slides/020.jpg"},{"scene":"rule","ch":4,"title":"A Rule That Picks a Bucket","zh":"选桶的规则","t":205.39,"lines":[["Bucket 2 gets five words, bucket 0 gets one, bucket 1 gets none.","2 号桶五个词，0 号桶一个，1 号桶一个都没有。"]],"img":"slides/021.jpg"},{"scene":"rule","ch":4,"title":"A Rule That Picks a Bucket","zh":"选桶的规则","t":212.24,"lines":[["Real books do the same. Across all eight, 2,691 distinct words start with s, and only 12 with z.","真实的书也一样。八本书里，s 开头的不同单词有 2,691 个，z 开头的只有 12 个。"]],"img":"slides/022.jpg"},{"scene":"rule","ch":4,"title":"A Rule That Picks a Bucket","zh":"选桶的规则","t":221.7,"lines":[["Rule two, still a toy: add up the letters' places in the alphabet, a is 1, z is 26.","规则二，还是玩具：把字母在字母表里的位置加起来，a 是 1，z 是 26。"],["sea is 19 plus 5 plus 1: 25. Mod 3 leaves 1, so bucket 1.","sea 是 19 加 5 加 1：25。对 3 取余剩 1，进 1 号桶。"]],"img":"slides/023.jpg"},{"scene":"rule","ch":4,"title":"A Rule That Picks a Bucket","zh":"选桶的规则","t":238.88,"lines":[["Do all six and each bucket gets exactly two words.","六个词都算完，每个桶正好两个词。"]],"img":"slides/024.jpg"},{"scene":"rule","ch":4,"title":"A Rule That Picks a Bucket","zh":"选桶的规则","t":244.43,"lines":[["The key part: sea gives 25 whichever book it came from. Same word, same bucket, every time.","关键在这里：不管 sea 来自哪本书，算出来都是 25。同一个词，永远进同一个桶。"]],"img":"slides/025.jpg"},{"scene":"rule","ch":4,"title":"A Rule That Picks a Bucket","zh":"选桶的规则","t":253.02,"lines":[["A rule like that is a hash function: it scrambles the input, but never changes its answer.","这样的规则就叫哈希函数：把输入打乱，但答案永远不变。"]],"img":"slides/026.jpg"},{"scene":"ihash","ch":5,"title":"ihash, by Hand","zh":"手算 ihash","t":263.51,"lines":[["The real rule is ihash, a hash function given to you in worker.go.","真正的规则是 ihash，worker.go 里发给你的哈希函数。"],["It's FNV-1a: start from a fixed 32-bit number, then take the word one byte at a time.","它是 FNV-1a：从一个固定的 32 位数开始，然后逐字节处理这个词。"],["For each byte: XOR it in, which flips the bits where the byte has a 1.","每个字节：先异或进去，也就是在这个字节为 1 的位上把位翻过来。"],["Then multiply by a fixed prime, and keep only the low 32 bits.","再乘一个固定的质数，只保留低 32 位。"]],"img":"slides/027.jpg"},{"scene":"ihash","ch":5,"title":"ihash, by Hand","zh":"手算 ihash","t":293.97,"lines":[["\"o\" is 0x6f. XOR, multiply: 0xea0c329e.","\"o\" 是 0x6f。异或、相乘：得到 0xea0c329e。"],["\"f\" is 0x66. XOR, multiply: 0x69343c68, which is 1,765,031,016.","\"f\" 是 0x66。异或、相乘：0x69343c68，也就是 1,765,031,016。"],["The mask clears the top bit, so the result is never negative. Here it changes nothing.","掩码把最高位清零，结果就不会是负数。这里它没改变任何东西。"],["Mod 10 gives 6. \"of\" goes to bucket 6.","对 10 取余得 6。\"of\" 进 6 号桶。"]],"img":"slides/028.jpg"},{"scene":"ihash","ch":5,"title":"ihash, by Hand","zh":"手算 ihash","t":316.75,"lines":[["Here is the same thing in worker.go: New32a is FNV-1a, and the comment says to take it mod NReduce.","worker.go 里是同一件事：New32a 就是 FNV-1a，注释写着要对 NReduce 取余。"],["And the real run agrees: \"of\" lands in bucket 6.","真实运行也一样：\"of\" 落在 6 号桶。"]],"img":"slides/029.jpg"},{"scene":"column","ch":6,"title":"Same Word, Same Column","zh":"同一个词，同一列","t":333.66,"lines":[["Like the toy, ihash depends only on the word, not on the book or the machine.","和玩具例子一样，ihash 只看这个词，不管它来自哪本书、哪台机器。"]],"img":"slides/030.jpg"},{"scene":"column","ch":6,"title":"Same Word, Same Column","zh":"同一个词，同一列","t":341.81,"lines":[["\"of\" appears in all eight books. How many intermediate files hold it?","\"of\" 八本书里都有。有几个中间文件装着它？"]],"img":"slides/031.jpg"},{"scene":"column","ch":6,"title":"Same Word, Same Column","zh":"同一个词，同一列","t":350.23,"lines":[["Eight: mr-0-6 through mr-7-6. One cell in every row, all in column 6.","八个：从 mr-0-6 到 mr-7-6。每一行一格，全在第 6 列。"],["Frankenstein's cell has 2,746 of them. Sherlock Holmes's has 2,734. Being Earnest's has 485.","《弗兰肯斯坦》那格有 2,746 个，《福尔摩斯》那格有 2,734 个，《认真的重要》那格有 485 个。"],["And no other column holds a single \"of\".","其他列一个 \"of\" 都没有。"]],"img":"slides/032.jpg"},{"scene":"sofar","ch":7,"title":"So Far, on the Page","zh":"小结（在图上）","t":371.05,"lines":[["So far, on our page: A, rows are map tasks, one per book.","到目前为止，在这张图上：A，行是 map 任务，一本书一行。"]],"img":"slides/033.jpg"},{"scene":"sofar","ch":7,"title":"So Far, on the Page","zh":"小结（在图上）","t":377.9,"lines":[["B and C: each pair's word, hashed mod 10, picks its column.","B 和 C：每个词对的词，哈希后对 10 取余，选出它的列。"]],"img":"slides/034.jpg"},{"scene":"sofar","ch":7,"title":"So Far, on the Page","zh":"小结（在图上）","t":384.32,"lines":[["\"of\" has reached column 6, in eight files. Next comes the gate, D.","\"of\" 已经到了第 6 列，分在八个文件里。下一步是闸门 D。"]],"img":"slides/035.jpg"},{"scene":"wait","ch":8,"title":"The Gate: Reduce Must Wait","zh":"闸门：Reduce 必须等","t":393.07,"lines":[["Reducer 6 wants to start. Map task 7, Tom Sawyer, is still running. Can it?","6 号 reducer 想开始了，map 任务 7《汤姆·索亚》还在跑。它能开始吗？"]],"img":"slides/036.jpg"},{"scene":"wait","ch":8,"title":"The Gate: Reduce Must Wait","zh":"闸门：Reduce 必须等","t":402.8,"lines":[["No. Column 6 is missing its last file, so its count for \"of\" would be 1,565 short.","不能。第 6 列还缺最后一个文件，\"of\" 的次数会少 1,565。"]],"img":"slides/037.jpg"},{"scene":"wait","ch":8,"title":"The Gate: Reduce Must Wait","zh":"闸门：Reduce 必须等","t":411.39,"lines":[["So reduce starts only after every map task has finished. The lab says the same.","所以 reduce 要等所有 map 任务都完成才开始。Lab 也是这么要求的。"],["Who checks this gate, and how, is the coordinator's job: episode 3.","谁来守这道闸、怎么守，是协调者的事：第 3 集讲。"]],"img":"slides/038.jpg"},{"scene":"group","ch":9,"title":"Sort, Then Group","zh":"先排序，再归组","t":427.42,"lines":[["Before the real column, one toy. Five pairs: of, a, of, the, a.","读真实的列之前，先看一个玩具例子。五个词对：of、a、of、the、a。"],["Sort them by word: a, a, of, of, the. Equal words now sit next to each other.","按词排序：a、a、of、of、the。相同的词现在挨在一起了。"],["Walk the list and cut it where the word changes: three runs.","沿着列表走，词一变就切一刀：三段。"],["Each run goes to Reduce once. wc.go's Reduce just counts: a 2, of 2, the 1.","每一段交给 Reduce 一次。wc.go 的 Reduce 只是数个数：a 2、of 2、the 1。"]],"img":"slides/039.jpg"},{"scene":"reduce","ch":10,"title":"Reduce Reads a Column","zh":"Reduce 读一整列","t":459.34,"lines":[["Now for real. Reducer 6 reads its column: eight files, mr-0-6 through mr-7-6.","现在来真的。6 号 reducer 读它那一列：八个文件，mr-0-6 到 mr-7-6。"],["That's 105,743 pairs, with every \"of\" somewhere among them.","一共 105,743 个词对，所有的 \"of\" 都在里面。"]],"img":"slides/040.jpg"},{"scene":"reduce","ch":10,"title":"Reduce Reads a Column","zh":"Reduce 读一整列","t":471.31,"lines":[["From here it's exactly the toy, and exactly mrsequential: sort by key.","从这里开始就和玩具例子、和 mrsequential 一模一样：按键排序。"]],"img":"slides/041.jpg"},{"scene":"reduce","ch":10,"title":"Reduce Reads a Column","zh":"Reduce 读一整列","t":477.72,"lines":[["The 13,536 \"of\" pairs now sit together. Walk each run of equal keys and call Reduce.","13,536 个 \"of\" 挨在了一起。走过每一段相同的键，调用 Reduce。"],["The lab says you may reuse this sorting and output code from mrsequential.","Lab 说可以直接复用 mrsequential 里的排序和输出代码。"]],"img":"slides/042.jpg"},{"scene":"reduce","ch":10,"title":"Reduce Reads a Column","zh":"Reduce 读一整列","t":492.73,"lines":[["Reducer 6 writes mr-out-6. One of its lines: of 13536. \"of\" has reached the bottom of the page.","6 号 reducer 写出 mr-out-6，其中一行：of 13536。\"of\" 走到了这张图的最底下。"]],"img":"slides/043.jpg"},{"scene":"evidence","ch":11,"title":"The Real Run: 80 Files","zh":"真实运行：80 个文件","t":503.66,"lines":[["Here's a real run of this data path on the eight books, with nReduce set to 10.","这是这条数据路径在八本书上的真实运行，nReduce 设为 10。"],["It wrote exactly 80 intermediate files, and ten output files.","它正好写了 80 个中间文件和 10 个输出文件。"]],"img":"slides/044.jpg"},{"scene":"evidence","ch":11,"title":"The Real Run: 80 Files","zh":"真实运行：80 个文件","t":517.8,"lines":[["Distinct words per bucket: between 2,173 and 2,251. ihash spreads the words evenly.","每个桶的不同单词数：2,173 到 2,251 之间。ihash 把词分得很均匀。"],["But pairs per bucket range from 39,508 to 105,743. Why so uneven?","但每个桶的词对数从 39,508 到 105,743。为什么差这么多？"],["Because a few words are huge. Bucket 6 holds \"of\", 13,536 pairs. Bucket 2 holds \"the\", 29,748.","因为少数几个词特别多。6 号桶有 \"of\"，13,536 个；2 号桶有 \"the\"，29,748 个。"],["A hash balances words, not work. One very common word always lands on one reducer.","哈希平衡的是词，不是工作量。一个特别常见的词，总是落在同一个 reducer 上。"]],"img":"slides/045.jpg"},{"scene":"test","ch":12,"title":"How the Test Judges It","zh":"测试怎么判对错","t":551.42,"lines":[["How does Lab 1 know your buckets are right? Look at TestWc in mr_test.go.","Lab 1 怎么知道你分桶分对了？看 mr_test.go 里的 TestWc。"]],"img":"slides/046.jpg"},{"scene":"test","ch":12,"title":"How the Test Judges It","zh":"测试怎么判对错","t":558.71,"lines":[["First, mkCorrectOutput runs mrsequential on the same books and sorts its output.","先是 mkCorrectOutput：在同样的书上跑 mrsequential，把输出排序。"]],"img":"slides/047.jpg"},{"scene":"test","ch":12,"title":"How the Test Judges It","zh":"测试怎么判对错","t":565.13,"lines":[["Then mergeOutput sorts all your mr-out files together into one file.","然后 mergeOutput 把你所有的 mr-out 文件合在一起排序。"]],"img":"slides/048.jpg"},{"scene":"test","ch":12,"title":"How the Test Judges It","zh":"测试怎么判对错","t":571.11,"lines":[["And runCmp compares the two, byte for byte. Our real run: identical.","最后 runCmp 把两个文件逐字节比较。我们的真实运行：完全相同。"]],"img":"slides/049.jpg"},{"scene":"test","ch":12,"title":"How the Test Judges It","zh":"测试怎么判对错","t":577.79,"lines":[["Suppose \"of\" ended up in two buckets. What happens?","假如 \"of\" 进了两个桶，会怎样？"],["Two lines start with \"of\", each with part of the count. cmp finds the difference, and the test fails.","会有两行以 \"of\" 开头，各带一部分次数。cmp 找到不同，测试失败。"]],"img":"slides/050.jpg"},{"scene":"limits","ch":13,"title":"What This Episode Skipped","zh":"这一集没讲的","t":596.26,"lines":[["We ran the whole page in one process, with nothing going wrong.","我们是在一个进程里跑完整张图的，什么错都没出。"]],"img":"slides/051.jpg"},{"scene":"limits","ch":13,"title":"What This Episode Skipped","zh":"这一集没讲的","t":602.68,"lines":[["Who hands each row and column to a worker, and what happens when a worker dies halfway?","谁把每一行、每一列派给 worker？worker 做到一半死了怎么办？"],["And how do you stop a half-written mr-X-Y from being read? That's episode 3.","怎么防止别人读到写了一半的 mr-X-Y？这些是第 3 集。"]],"img":"slides/052.jpg"},{"scene":"limits","ch":13,"title":"What This Episode Skipped","zh":"这一集没讲的","t":618.56,"lines":[["How the pairs are written inside each file is your choice. The lab suggests JSON, one pair at a time.","每个文件里词对怎么写由你决定。Lab 建议用 JSON，一次写一个。"]],"img":"slides/053.jpg"},{"scene":"recap","ch":14,"title":"Recap, on the Page","zh":"本集要点（在图上）","t":630.35,"lines":[["One: M map tasks times R reduce buckets. Eight times ten, eighty files.","一：M 个 map 任务乘 R 个 reduce 桶。八乘十，八十个文件。"]],"img":"slides/054.jpg"},{"scene":"recap","ch":14,"title":"Recap, on the Page","zh":"本集要点（在图上）","t":637.2,"lines":[["Two: ihash mod nReduce picks the column, so every copy of a word meets in one reducer.","二：ihash 对 nReduce 取余决定列，同一个词的所有副本会在同一个 reducer 汇合。"]],"img":"slides/055.jpg"},{"scene":"recap","ch":14,"title":"Recap, on the Page","zh":"本集要点（在图上）","t":645.8,"lines":[["Three: reduce reads a whole column, so it waits at the gate for every map task.","三：reduce 读一整列，所以要在闸门前等所有 map 任务完成。"]],"img":"slides/056.jpg"},{"scene":"turn","ch":15,"title":"Your Turn","zh":"轮到你","t":655.85,"lines":[["Your turn: hash \"the\" by hand. Three bytes: 0x74, 0x68, 0x65.","轮到你：手算 \"the\" 的哈希。三个字节：0x74、0x68、0x65。"],["Which bucket does it go to? Careful with the mask this time.","它进几号桶？这次小心掩码。"],["The hash is 3,020,861,980. The mask clears the top bit: 873,378,332. Mod 10: bucket 2.","哈希是 3,020,861,980。掩码清掉最高位：873,378,332。对 10 取余：2 号桶。"],["And mr-out-2 says: the 29748. Next episode: the coordinator, crashes, and atomic rename.","mr-out-2 里写着：the 29748。下一集：协调者、崩溃和原子改名。"]],"img":"slides/057.jpg"}],"code":[{"key":"page-pgA","file":"src/main/mrcoordinator.go","a":23,"b":23,"t":52.25,"again":[90,370.25,388.75,629.5,651],"fn":"","scene":"idea","slide":4},{"key":"page-pgB","file":"src/mrapps/wc.go","a":28,"b":28,"t":60.5,"again":[90,378,388.75,651],"fn":"","scene":"idea","slide":5},{"key":"page-pgC","file":"src/mr/worker.go","a":16,"b":21,"t":67.75,"again":[90,378,637.25,651],"fn":"","scene":"idea","slide":6},{"key":"page-pgE1","file":"src/main/mrsequential.go","a":59,"b":59,"t":82.75,"again":[388.75,646],"fn":"","scene":"idea","slide":8},{"key":"page-pgE2","file":"src/main/mrsequential.go","a":78,"b":78,"t":82.75,"again":[388.75,646],"fn":"","scene":"idea","slide":8},{"key":"page-pgE3","file":"src/main/mrsequential.go","a":81,"b":81,"t":82.75,"again":[388.75,646],"fn":"","scene":"idea","slide":8},{"key":"comment","file":"src/main/mrsequential.go","a":48,"b":59,"fn":"main()","t":99,"again":[],"scene":"comment","slide":9},{"key":"coord","file":"src/main/mrcoordinator.go","a":18,"b":26,"fn":"main()","t":157,"again":[],"scene":"grid","slide":16},{"key":"ihash","file":"src/mr/worker.go","a":10,"b":22,"fn":"ihash()","t":317,"again":[],"scene":"ihash","slide":28},{"key":"wcreduce","file":"src/mrapps/wc.go","a":37,"b":40,"fn":"Reduce()","t":449.75,"again":[],"scene":"group","slide":38},{"key":"seqsort","file":"src/main/mrsequential.go","a":59,"b":62,"fn":"main()","t":471.75,"again":[],"scene":"reduce","slide":40},{"key":"seqreduce","file":"src/main/mrsequential.go","a":68,"b":84,"fn":"main()","t":478,"again":[],"scene":"reduce","slide":41},{"key":"testwc","file":"src/mr/mr_test.go","a":9,"b":23,"fn":"TestWc()","t":551,"again":[],"scene":"test","slide":44},{"key":"mkcorrect","file":"src/mr/util.go","a":93,"b":93,"fn":"mkCorrectOutput()","t":559.25,"again":[],"scene":"test","slide":46},{"key":"merge","file":"src/mr/util.go","a":114,"b":114,"fn":"mergeOutput()","t":565.5,"again":[],"scene":"test","slide":47},{"key":"cmp","file":"src/mr/util.go","a":159,"b":159,"fn":"runCmp()","t":571.5,"again":[],"scene":"test","slide":48}],"practice":[{"scene":"rule","q":["为什么不按单词首字母分桶？","Why not pick the bucket by the word's first letter?"],"a":["太不均匀：八本书里 s 开头的不同单词有 2,691 个，z 开头的只有 12 个。有的 reducer 忙死，有的闲着。","Far too uneven: across the eight books 2,691 distinct words start with s and only 12 with z. Some reducers drown while others sit idle."],"why":["统计自 data/runs.sh 里 mrsequential 的真实输出（按首字母小写计数）。","Counted from mrsequential's real output in data/runs.sh (first letter, lower-cased)."],"run":"episodes/ep02-map-partition-reduce/data/runs.sh","t":175.357},{"scene":"column","q":["\"of\" 八本书里都有。有几个中间文件装着它？","\"of\" is in all eight books. How many intermediate files hold it?"],"a":["8 个：mr-0-6 到 mr-7-6。ihash 只看词本身，所以每一行都把 \"of\" 放进第 6 列。","Eight: mr-0-6 through mr-7-6. ihash looks only at the word, so every row puts \"of\" in column 6."],"why":["真实运行里 \"of\" 在八个 map 任务中的个数是 485、2,251、2,746、1,461、1,753、541、2,734、1,565，全在 6 号桶。","In the real run the eight map tasks hold 485, 2,251, 2,746, 1,461, 1,753, 541, 2,734 and 1,565 \"of\" pairs, all in bucket 6."],"src":["src/mr/worker.go:16–22"],"run":"episodes/ep02-map-partition-reduce/data/runs.sh","t":332.758},{"scene":"evidence","q":["每个桶的不同单词数在 2,173 到 2,251 之间，很均匀。那为什么每个桶的词对数从 39,508 到 105,743 不等？","Distinct words per bucket are even (2,173 to 2,251). Why do pairs per bucket range from 39,508 to 105,743?"],"a":["哈希平衡的是键，不是工作量。少数几个词特别多：6 号桶有 \"of\"（13,536 个），2 号桶有 \"the\"（29,748 个）。一个常见的键总落在同一个 reducer 上。","A hash balances keys, not work. A few words are huge: bucket 6 holds \"of\" (13,536) and bucket 2 holds \"the\" (29,748). One common key always lands on one reducer."],"why":["真实运行，nReduce = 10，统计每个 reduce 任务读入的词对数和输出的行数。","Real run with nReduce = 10, counting the pairs each reduce task reads and the lines it writes."],"run":"episodes/ep02-map-partition-reduce/data/runs.sh","t":502.759},{"scene":"wait","q":["map 任务 7 还在跑时，6 号 reduce 能开始吗？","Can reduce task 6 start while map task 7 is still running?"],"a":["不能。第 6 列还缺 mr-7-6，\"of\" 会少 1,565 个，输出 of 11971 而不是 of 13536。所有 map 完成后 reduce 才能开始。","No. Column 6 is still missing mr-7-6, so \"of\" would be 1,565 short and the output would say of 11971 instead of of 13536. Reduce starts only after every map task is done."],"why":["mr-7-6（汤姆·索亚）里的 \"of\" 个数来自真实运行；13,536 − 1,565 = 11,971。","The count of \"of\" in mr-7-6 (Tom Sawyer) is from the real run; 13,536 − 1,565 = 11,971."],"run":"episodes/ep02-map-partition-reduce/data/runs.sh","t":392.173},{"scene":"turn","q":["手算 ihash(\"the\")：它进几号桶？","Hash \"the\" by hand: which bucket does it go to?"],"a":["2 号桶。FNV-1a 得到 3,020,861,980，最高位是 1；掩码 & 0x7fffffff 清掉它得 873,378,332；对 10 取余得 2。","Bucket 2. FNV-1a gives 3,020,861,980, whose top bit is set; the mask & 0x7fffffff clears it, giving 873,378,332; mod 10 gives 2."],"why":["data.py 逐字节算出同样的值，并和真实运行里 \"the\" 所在的桶（2）核对；mr-out-2 里有 \"the 29748\"。","data.py computes the same values byte by byte and checks them against the bucket \"the\" landed in during the real run (2); mr-out-2 contains \"the 29748\"."],"src":["src/mr/worker.go:18–22"],"run":"episodes/ep02-map-partition-reduce/data/runs.sh","t":654.953},{"q":["如果忘了掩码 & 0x7fffffff，在 64 位的 Go 上 ihash(\"the\") % 10 会变吗？","If you dropped the mask & 0x7fffffff, would ihash(\"the\") % 10 change on 64-bit Go?"],"a":["会。h.Sum32() 是 3,020,861,980，转成 64 位 int 仍是正数，3,020,861,980 % 10 = 0，不是 2。\"the\" 会进 0 号桶。只要所有 worker 都用同一个函数，结果仍然正确，只是桶号不同。","Yes. h.Sum32() is 3,020,861,980, still positive as a 64-bit int, and 3,020,861,980 % 10 = 0, not 2. \"the\" would go to bucket 0. As long as every worker uses the same function the output is still correct; only the bucket numbers change."],"why":["按 worker.go 第 21 行和 FNV-1a 的结果推算；没有修改 worker.go 去实测。","Worked out from worker.go line 21 and the FNV-1a value; not measured by changing worker.go."],"src":["src/mr/worker.go:21"],"reasoned":true},{"q":["测试 TestWc 只比较合并排序后的输出。如果你把 nReduce 换成别的数，测试还会过吗？","TestWc compares only the merged, sorted output. Would it still pass if a different nReduce were used?"],"a":["会。只要每个词只进一个桶，合并排序后的内容就和 mrsequential 的一样，跟桶的个数无关。（但 mrcoordinator.go 固定传 10，而且不让改。）","Yes. As long as each word goes to exactly one bucket, the merged sorted output equals mrsequential's whatever the number of buckets. (mrcoordinator.go always passes 10, though, and must not be changed.)"],"why":["mr_test.go 第 18–22 行：mkCorrectOutput、mergeOutput 排序后用 cmp 逐字节比较，不看文件个数。","mr_test.go lines 18–22: mkCorrectOutput and mergeOutput sort, then cmp compares byte for byte; the number of files isn't checked here."],"src":["src/mr/mr_test.go:18–22","src/main/mrcoordinator.go:23"],"reasoned":true}],"practiceKind":"code","sections":null};

<title>MapReduce 模型：Map、分桶、Reduce 课件</title>

<style>
:root{
  --bg:#F2F2F0; --tile:#FFFFFF; --soft:#F5F5F3; --soft-2:#FAFAF9; --edge:#E4E4E1; --edge-2:#D6D6D2;
  --ink:#141414; --ink-2:#3F3F46; --mute:#6E6E73; --faint:#A1A1A6;
  --acc:#4F46E5; --acc-soft:#EEF0FF;
  --f-sans:"Geist","Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --f-mono:"Geist Mono","SFMono-Regular",Menlo,Consolas,"Noto Sans SC",monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0B0B0C; --tile:#161618; --soft:#1D1D20; --soft-2:#1A1A1D; --edge:#26262A; --edge-2:#34343A;
  --ink:#EDEDEF; --ink-2:#C9C9CF; --mute:#9A9AA2; --faint:#6B6B73; --acc:#8B85FF; --acc-soft:#22213A; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0B0B0C; --tile:#161618; --soft:#1D1D20; --soft-2:#1A1A1D; --edge:#26262A; --edge-2:#34343A;
  --ink:#EDEDEF; --ink-2:#C9C9CF; --mute:#9A9AA2; --faint:#6B6B73; --acc:#8B85FF; --acc-soft:#22213A; color-scheme:dark; }

*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0; background:var(--bg); color:var(--ink); font:15px/1.6 var(--f-sans); -webkit-font-smoothing:antialiased; overflow-wrap:anywhere}  /* long identifiers (CURRENT_CTL_CONFIG_PWM_DUTY_CYCLE_MAX) must not widen the page at phone width */
.wrap{max-width:1320px; margin:0 auto; padding-inline:20px; padding-block:36px 72px; display:flex; flex-direction:column; gap:28px}
h1,h2,h3{margin:0; text-wrap:balance}
p{margin:0}
:focus-visible{outline:2px solid var(--acc); outline-offset:2px}
a{color:inherit}

.hero{background:var(--tile); border:1px solid var(--edge); border-radius:22px; padding:28px 30px; display:flex; flex-direction:column; gap:12px}
.hero-top{display:flex; align-items:center; gap:10px; margin-bottom:4px}
.home{font:500 13px var(--f-sans); color:var(--mute); text-decoration:none; padding:6px 12px; border-radius:10px; background:var(--soft)}
.home:hover{color:var(--ink)}
.lang{margin-left:auto; display:inline-flex; padding:3px; gap:2px; border-radius:999px; background:var(--soft); border:0; cursor:pointer; font:600 12px/1 var(--f-mono); color:var(--mute)}
.lang span{padding:5px 9px; border-radius:999px}
.lang span.on{background:var(--ink); color:var(--bg)}
.eyebrow{font:500 13px var(--f-mono); color:var(--acc)}
h1{font-size:clamp(32px,4.4vw,52px); font-weight:600; letter-spacing:-.03em; line-height:1.08}
.lead{color:var(--ink-2); max-width:62ch}
.acts{display:flex; flex-wrap:wrap; gap:8px; margin-top:6px}
.go{display:inline-flex; align-items:center; gap:6px; text-decoration:none; border-radius:12px; padding:9px 14px; font:500 14px var(--f-sans); background:var(--soft); color:var(--ink); border:0; cursor:pointer}
.go:hover{background:var(--edge)}
.go.main{background:var(--ink); color:var(--bg)}
.num{font-family:var(--f-mono); font-variant-numeric:tabular-nums}

.toc{position:sticky; top:0; z-index:2; display:flex; gap:6px; overflow-x:auto; padding:10px 0; background:var(--bg); scrollbar-width:thin}
.toc a{flex:none; text-decoration:none; font:500 13px var(--f-sans); color:var(--ink-2); background:var(--tile); border:1px solid var(--edge); border-radius:999px; padding:6px 12px; white-space:nowrap}
.toc a .num{color:var(--faint); margin-right:6px}
.toc a.on{background:var(--acc-soft); box-shadow:inset 0 0 0 1.5px var(--acc); border-color:transparent; color:var(--ink)}

.chap{display:flex; flex-direction:column; gap:14px; scroll-margin-top:64px}
.chap > header{display:flex; align-items:baseline; gap:12px; padding:8px 4px 0}
.chap > header .num{font-size:14px; color:var(--acc)}
.chap > header h2{font-size:24px; font-weight:600; letter-spacing:-.02em}
.chap > header small{color:var(--mute); font-size:14px}
.slide{display:grid; grid-template-columns:minmax(0,1.7fr) minmax(0,1fr); gap:0; background:var(--tile); border:1px solid var(--edge); border-radius:22px; overflow:hidden}
.slide img{display:block; width:100%; aspect-ratio:16/9; background:#070b16; cursor:zoom-in}
.notes{padding:20px 22px; display:flex; flex-direction:column; gap:12px}
.notes .meta{display:flex; gap:10px; align-items:center; font:500 12px var(--f-mono); color:var(--faint)}
.notes .meta a{color:var(--acc); text-decoration:none; background:var(--acc-soft); border-radius:8px; padding:3px 8px}
.line .a{color:var(--ink); font-size:15.5px}
.line .b{color:var(--mute); font-size:13.5px; margin-top:2px}
.zoom{position:fixed; inset:0; z-index:9; background:rgba(0,0,0,.88); display:flex; align-items:center; justify-content:center; padding:16px; cursor:zoom-out}
.zoom img{max-width:100%; max-height:100%; border-radius:8px}
/* code index + practice: the two pages that close the 课件 */
.extra{display:flex; flex-direction:column; gap:14px; scroll-margin-top:64px}
.extra > header{display:flex; align-items:baseline; gap:12px; padding:8px 4px 0; flex-wrap:wrap}
.extra > header h2{font-size:24px; font-weight:600; letter-spacing:-.02em}
.extra > header small{color:var(--mute); font-size:14px}
.tile{background:var(--tile); border:1px solid var(--edge); border-radius:22px; padding:8px 0; overflow-x:auto}
.cix{width:100%; border-collapse:collapse; font-size:14px}
.cix th{text-align:left; font:500 12px var(--f-mono); color:var(--faint); padding:10px 14px; border-bottom:1px solid var(--edge)}
.cix td{padding:10px 14px; border-bottom:1px solid var(--edge); vertical-align:top}
.cix tr:last-child td{border-bottom:0}
.cix .f{font-family:var(--f-mono); font-size:13px; color:var(--ink); word-break:break-all}
.cix .f b{font-weight:600}
.cix .fn{font-family:var(--f-mono); font-size:13px; color:var(--acc)}
.cix .where{color:var(--ink-2)} .cix .where small{display:block; color:var(--mute); font-size:12.5px}
.cix a{color:var(--acc); text-decoration:none; font-family:var(--f-mono); font-size:12.5px; background:var(--acc-soft); border-radius:8px; padding:2px 7px; white-space:nowrap; display:inline-block; margin:0 4px 4px 0}
.qs{display:flex; flex-direction:column; gap:12px}
.q{background:var(--tile); border:1px solid var(--edge); border-radius:22px; padding:20px 22px; display:flex; flex-direction:column; gap:10px}
.q .meta{display:flex; gap:8px; align-items:center; flex-wrap:wrap; font:500 12px var(--f-mono); color:var(--faint)}
.chip{font:500 12px var(--f-sans); border-radius:999px; padding:3px 9px; background:var(--soft); color:var(--ink-2)}
.chip.new{background:var(--acc-soft); color:var(--acc)}
.chip.reasoned{background:transparent; box-shadow:inset 0 0 0 1px var(--edge-2); color:var(--mute)}
.q .meta a{color:var(--acc); text-decoration:none; background:var(--acc-soft); border-radius:8px; padding:3px 8px}
.q .ask{font-size:16px; color:var(--ink)} .q .ask small{display:block; color:var(--mute); font-size:13.5px; margin-top:2px}
.q details{border-top:1px solid var(--edge); padding-top:10px}
.q summary{cursor:pointer; font:500 14px var(--f-sans); color:var(--acc); list-style:none} .q summary::-webkit-details-marker{display:none}
.q .ans{margin-top:8px; display:flex; flex-direction:column; gap:8px}
.q .ans .a{color:var(--ink)} .q .ans .b{color:var(--mute); font-size:13.5px}
.q .why{background:var(--soft); border-radius:14px; padding:10px 14px; font-size:14px; color:var(--ink-2)}
.q .why .lab{font:500 12px var(--f-mono); color:var(--faint); display:block; margin-bottom:2px}
.q code{font-family:var(--f-mono); font-size:12.5px; background:var(--soft-2); border:1px solid var(--edge); border-radius:6px; padding:1px 6px; word-break:break-all}
@media (max-width:760px){ .slide{grid-template-columns:1fr} .hero{padding:22px 20px}
  .cix thead{display:none} .cix tr{display:grid; grid-template-columns:28px minmax(0,1fr); column-gap:6px; padding:12px 14px; border-bottom:1px solid var(--edge)}
  .cix tr:last-child{border-bottom:0} .cix td{display:block; padding:0; border:0; grid-column:2} .cix td:first-child{grid-column:1; grid-row:1 / span 4}
  .cix .fn{word-break:break-all; margin-top:2px} .cix .where{margin-top:4px} }

/* Handout: one slide per A4 landscape page, notes in both languages (slides.mjs prints ?print to slides.pdf) */
@page{size:A4 landscape; margin:10mm}
@media print{
  body{background:#fff; color:#141414}
  .wrap{padding:0; gap:0; max-width:none}
  .hero,.toc,.chap > header,.zoom,.meta a{display:none!important}
  .chap{gap:0}
  /* one page per slide: the picture gives up height so up to --max-lines 6 of notes always fit (no clipping) */
  .slide{display:flex; flex-direction:column; border:0; border-radius:0; break-after:page; break-inside:avoid; height:189mm}
  .slide img{flex:0 1 136mm; min-height:60mm; width:100%; height:auto; aspect-ratio:auto; object-fit:contain; background:none; cursor:auto}
  .notes{flex:none; padding:4mm 2mm 0; gap:5px}
  .notes .meta{color:#6E6E73}
  .line .a{font-size:11pt; color:#141414} .line .b{font-size:9.5pt; color:#3F3F46}
  .extra{break-before:page; gap:4mm} .extra > header{display:flex!important; padding:0}
  .tile,.q{border:1px solid #D6D6D2; border-radius:8px; break-inside:avoid; background:#fff} .tile{overflow:visible}
  .cix{font-size:9pt} .cix td,.cix th{padding:4px 8px} .cix a{background:none; padding:0}
  .q{padding:4mm 5mm; gap:2mm} .q summary{display:none} .q .why{background:#F5F5F3}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="hero-top"><a class="home" id="homeLink" href="../../index.html#ep02" hidden data-en="← Course home">← 课程首页</a><button class="lang" id="langBtn" type="button"></button></div>
    <p class="eyebrow" data-en="Distributed Systems, Read Closely · Episode 2 · Slides">分布式系统从零读懂 · 第 2 集 · 课件</p>
    <h1 data-en="The MapReduce Model: Map, Partition, Reduce">MapReduce 模型：Map、分桶、Reduce</h1>
    <p class="lead" id="lead"></p>
    <div class="acts"><a class="go main" href="slides.pdf" download data-en="Download PDF">下载 PDF</a><button class="go" type="button" onclick="print()" data-en="Print">打印</button></div>
  </header>
  <nav class="toc" id="toc" aria-label="章节" data-en-label="Chapters"></nav>
  <main id="chapters" style="display:flex; flex-direction:column; gap:36px"></main>
  <section class="extra" id="code-index" hidden></section>
  <section class="extra" id="paper-map" hidden></section>
  <section class="extra" id="practice" hidden></section>
</div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const mmss = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
if (EN) document.querySelectorAll('[data-en]').forEach(e => e.innerHTML = e.dataset.en);
if (EN) document.querySelectorAll('[data-en-label]').forEach(e => e.setAttribute('aria-label', e.dataset.enLabel));
if (EN) document.title = $('h1').textContent + ' · Slides';  // read from the DOM: a title may contain quotes
$('#langBtn').innerHTML = `<span class="${EN ? '' : 'on'}">中</span><span class="${EN ? 'on' : ''}">EN</span>`;
$('#langBtn').addEventListener('click', () => { try { localStorage.setItem('course.lang', EN ? 'zh' : 'en'); } catch {} location.reload(); });
// links back into the course site only work when served by it (not from the episode folder on file://)
const SITE = location.protocol !== 'file:';
$('#homeLink').hidden = !SITE;
$('#lead').textContent = L(`视频的 ${DATA.slides.length} 张截图，按章节排好，每张旁边是那一段的讲解（${mmss(DATA.total)} 视频）。点图片看大图，点时间从那里开始播放视频。`,
  `${DATA.slides.length} screenshots of the video, by chapter, each with the narration of that moment (${mmss(DATA.total)} of video). Click a picture to enlarge it, a time to play the video from there.`);
const title = c => PRINT ? `${c.zh} · ${c.title}` : L(c.zh, c.title);
const chaps = DATA.chapters.map(c => ({...c, slides: DATA.slides.filter(s => s.scene === c.id)})).filter(c => c.slides.length);
$('#toc').innerHTML = chaps.map(c => `<a href="#c-${esc(c.id)}"><span class="num">${String(c.n).padStart(2, '0')}</span>${esc(title(c))}</a>`).join('');
$('#chapters').innerHTML = chaps.map(c => `<section class="chap" id="c-${esc(c.id)}">
  <header><span class="num">${String(c.n).padStart(2, '0')}</span><h2>${esc(title(c))}</h2><small>${esc(EN ? c.zh : c.title)}</small></header>
  ${c.slides.map(s => `<article class="slide" id="s-${DATA.slides.indexOf(s) + 1}"><img src="${esc(s.img)}" alt="${esc(title(c))}" loading="${PRINT ? 'eager' : 'lazy'}">
    <div class="notes"><div class="meta"><span class="num">${String(DATA.slides.indexOf(s) + 1).padStart(3, '0')} · ${esc(title(c))}</span>${SITE ? `<a class="num" href="../../index.html#ep02@${Math.floor(s.t)}">▶ ${mmss(s.t)}</a>` : `<span class="num">${mmss(s.t)}</span>`}</div>
      ${s.lines.map(([en, zh]) => `<div class="line"><div class="a">${esc(EN ? en : zh)}</div><div class="b">${esc(EN ? zh : en)}</div></div>`).join('')}</div></article>`).join('')}
</section>`).join('');
// in print (the PDF) labels carry both languages, like the slide notes
const L2 = (zh, en) => PRINT ? (zh && en ? `${zh} · ${en}` : zh || en) : L(zh, en);
// code index: every code pane of the video, in order of appearance
const chapOf = id => DATA.chapters.find(c => c.id === id);
const play = t => SITE ? `<a href="../../index.html#ep02@${Math.floor(t)}">▶ ${mmss(t)}</a>` : `<span class="num">${mmss(t)}</span> `;
if (DATA.code && DATA.code.length) {
  const loc = c => { if (!c.file) return `<b>${esc(c.title)}</b>`; const i = c.file.lastIndexOf('/') + 1;
    return `${esc(c.file.slice(0, i))}<b>${esc(c.file.slice(i))}</b>${c.a ? ` · L${c.a}${c.b && c.b !== c.a ? '–' + c.b : ''}` : ''}`; };
  $('#code-index').hidden = false;
  $('#code-index').innerHTML = `<header><h2>${L2('代码索引', 'Code index')}</h2><small>${L2(`视频里出现的 ${DATA.code.length} 段源码，按出场顺序。对着文件和行号打开源码，就是视频里那几行。`, `The ${DATA.code.length} source excerpts shown in the video, in order of appearance. Open the file at these lines and you see exactly what the video showed.`)}</small></header>
  <div class="tile"><table class="cix"><thead><tr><th>#</th><th>${L2('文件 · 行', 'File · lines')}</th><th>${L2('函数', 'Function')}</th><th>${L2('出现在', 'Shown in')}</th><th>${L2('视频', 'Video')}</th></tr></thead><tbody>
  ${DATA.code.map((c, i) => { const ch = chapOf(c.scene); return `<tr><td class="num">${i + 1}</td><td class="f">${loc(c)}</td><td class="fn">${esc(c.fn || '')}</td>
    <td class="where">${esc(title(ch))}<small><a href="#s-${c.slide + 1}">${L2('课件', 'Slide')} ${String(c.slide + 1).padStart(3, '0')}</a></small></td>
    <td>${[c.t, ...c.again].map(play).join('')}</td></tr>`; }).join('')}
  </tbody></table></div>`;
}
// paper map (paper-style courses): which part of the paper each part of the episode covers
if (DATA.sections && DATA.sections.length) {
  $('#paper-map').hidden = false;
  $('#paper-map').innerHTML = `<header><h2>${L2('本集对应原文', 'Paper map')}</h2><small>${L2('这一集讲到的原文章节和图表，以及视频里讲到它的地方。对照原文读，最快。', 'The sections and figures of the paper this episode covers, and where the video covers them. Read them side by side.')}</small></header>
  <div class="tile"><table class="cix"><thead><tr><th>${L2('原文', 'Paper')}</th><th>${L2('本集讲了什么', 'What the episode covers')}</th><th>${L2('视频', 'Video')}</th></tr></thead><tbody>
  ${DATA.sections.map(x => `<tr><td class="f"><b>${esc(x.sec)}</b></td><td>${esc(PRINT ? x.what[0] + ' / ' + x.what[1] : L(x.what[0], x.what[1]))}</td><td>${x.t != null ? play(x.t) : ''}</td></tr>`).join('')}
  </tbody></table></div>`;
}
// practice: the video's guess-first questions plus new ones, each with its answer and what it rests on
const PAPER = DATA.practiceKind === 'paper';
if (DATA.practice && DATA.practice.length) {
  const two = ([zh, en]) => PRINT ? `<div class="a">${esc(zh)}</div><div class="b">${esc(en)}</div>` : `<div class="a">${esc(L(zh, en))}</div><div class="b">${esc(EN ? zh : en)}</div>`;
  $('#practice').hidden = false;
  $('#practice').innerHTML = `<header><h2>${L2('练习', 'Practice')}</h2><small>${PAPER ? L2('先自己答，再看答案。每个答案都写了依据：原文的章节、图表，或者手算。', 'Answer first, then open the answer. Each one says what it rests on: a section or figure of the paper, or a hand calculation.') : L2('先自己答，再看答案。每个答案都写了依据：源码行，或者真实运行。', 'Answer first, then open the answer. Each one says what it rests on: source lines or a real run.')}</small></header>
  <div class="qs">${DATA.practice.map((q, i) => `<article class="q">
    <div class="meta"><span class="num">${L2(`第 ${i + 1} 题`, `Q${i + 1}`)}</span><span class="chip ${q.scene && !q.new ? '' : 'new'}">${q.scene && !q.new ? L2('视频里的题', 'From the video') : L2('新题', 'New')}</span>${q.reasoned ? `<span class="chip reasoned">${PAPER ? L2('按原文推演', 'Worked out from the paper') : L2('按代码推演', 'Worked out from the code')}</span>` : ''}${q.scene && q.t != null ? play(q.t) : ''}</div>
    <div class="ask">${PRINT ? `${esc(q.q[0])}<small>${esc(q.q[1])}</small>` : `${esc(L(q.q[0], q.q[1]))}<small>${esc(EN ? q.q[0] : q.q[1])}</small>`}</div>
    <details${PRINT ? ' open' : ''}><summary>${L2('看答案', 'Show answer')}</summary><div class="ans">${two(q.a)}
      <div class="why"><span class="lab">${L2('依据', 'Evidence')}</span>${esc(PRINT ? q.why[0] + ' / ' + q.why[1] : L(q.why[0], q.why[1]))}
      ${(q.src || []).length ? `<div style="margin-top:6px">${q.src.map(x => `<code>${esc(x)}</code>`).join(' ')}</div>` : ''}${q.run ? `<div style="margin-top:6px"><code>${esc(q.run)}</code></div>` : ''}</div></div></details>
  </article>`).join('')}</div>`;
}
$('#toc').insertAdjacentHTML('beforeend', (DATA.code && DATA.code.length ? `<a href="#code-index">${L('代码索引', 'Code index')}</a>` : '') + (DATA.sections && DATA.sections.length ? `<a href="#paper-map">${L('本集对应原文', 'Paper map')}</a>` : '') + (DATA.practice && DATA.practice.length ? `<a href="#practice">${L('练习', 'Practice')}</a>` : ''));
document.addEventListener('click', e => {
  const img = e.target.closest('.slide img'); if (!img) return;
  const z = document.createElement('div'); z.className = 'zoom'; z.innerHTML = `<img src="${img.src}" alt="">`; z.onclick = () => z.remove(); document.body.append(z);
});
addEventListener('keydown', e => { if (e.key === 'Escape') document.querySelector('.zoom')?.remove(); });
// highlight the chapter being read
const links = [...document.querySelectorAll('.toc a')];
const io = new IntersectionObserver(es => es.forEach(x => { if (!x.isIntersecting) return; links.forEach(a => a.classList.toggle('on', a.getAttribute('href') === '#' + x.target.id)); }), {rootMargin: '-20% 0px -70% 0px'});
document.querySelectorAll('.chap, .extra').forEach(s => io.observe(s));
</script>
</body>
</html>
