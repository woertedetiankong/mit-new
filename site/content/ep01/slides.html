const DATA = {"total":746.55,"chapters":[{"id":"intro","n":0,"title":"Why Distributed Is Hard","zh":"分布式系统难在哪","t":0},{"id":"idea","n":1,"title":"The Whole Idea First","zh":"先说结论","t":30.77},{"id":"one","n":2,"title":"One Machine","zh":"一台机器","t":98.666},{"id":"run","n":3,"title":"The Real Run","zh":"真实运行","t":166.15},{"id":"scale","n":4,"title":"Now Make It a Terabyte","zh":"换成 1 TB","t":198.815},{"id":"nothing","n":5,"title":"Two Machines Share Nothing","zh":"两台机器什么都不共享","t":242.997},{"id":"split","n":6,"title":"Split the Work","zh":"把活分出去","t":296.342},{"id":"fail","n":7,"title":"1 · A Worker Dies","zh":"难题 1 · worker 挂了","t":340.66},{"id":"conc","n":8,"title":"2 · Two Writers, One File","zh":"难题 2 · 两个人写同一个文件","t":402.143},{"id":"net","n":9,"title":"3 · Did It Arrive?","zh":"难题 3 · 消息到了吗","t":454.184},{"id":"sofar","n":10,"title":"So Far, on the Page","zh":"小结（在图上）","t":514.641},{"id":"agree","n":11,"title":"4 · The Coordinator Dies","zh":"难题 4 · 协调者挂了","t":543.38},{"id":"labs","n":12,"title":"Five Labs on One Board","zh":"五个 Lab 对上这块板子","t":606.984},{"id":"src","n":13,"title":"Finding Your Way in src/","zh":"在 src/ 里认路","t":648.362},{"id":"recap","n":14,"title":"Recap, on the Page","zh":"本集要点（在图上）","t":697.463},{"id":"turn","n":15,"title":"Your Turn","zh":"轮到你","t":724.267}],"slides":[{"scene":"intro","ch":0,"title":"Why Distributed Is Hard","zh":"分布式系统难在哪","t":0.9,"lines":[["Episode 1: why distributed systems are hard.","第 1 集：分布式系统难在哪。"],["A distributed system is one job done by several computers that talk over a network.","分布式系统，就是几台通过网络通信的计算机一起完成一件事。"]],"img":"slides/001.jpg"},{"scene":"intro","ch":0,"title":"Why Distributed Is Hard","zh":"分布式系统难在哪","t":13.02,"lines":[["We'll take one small job, counting words in eight books, and try to spread it across machines.","我们拿一个小任务——数八本书里的词——试着把它分到多台机器上。"]],"img":"slides/002.jpg"},{"scene":"intro","ch":0,"title":"Why Distributed Is Hard","zh":"分布式系统难在哪","t":21.61,"lines":[["By the end, you'll know your way around src/, and which files are yours to write.","看完这一集，你能在 src/ 里认路，也知道哪些文件归你写。"]],"img":"slides/003.jpg"},{"scene":"idea","ch":1,"title":"The Whole Idea First","zh":"先说结论","t":31.67,"lines":[["Here is the whole episode in two sentences.","先用两句话说完这一集。"]],"img":"slides/004.jpg"},{"scene":"idea","ch":1,"title":"The Whole Idea First","zh":"先说结论","t":36.35,"lines":[["One machine counts our eight books in a fraction of a second.","一台机器数完八本书，只要零点几秒。"],["Many machines are how the job scales, and they bring four problems one process never has.","要扩大规模就得用很多台机器，而它们带来四个单进程里从来没有的难题。"]],"img":"slides/005.jpg"},{"scene":"idea","ch":1,"title":"The Whole Idea First","zh":"先说结论","t":51.35,"lines":[["Now the page. A, on top: one process. Read the books, Map, sort, Reduce, one output file.","下面是这张图。顶上 A：一个进程。读书、Map、排序、Reduce、一个输出文件。"]],"img":"slides/006.jpg"},{"scene":"idea","ch":1,"title":"The Whole Idea First","zh":"先说结论","t":59.94,"lines":[["B, below: the same steps, spread over machines that pass messages.","下面 B：同样的步骤，分到几台互相发消息的机器上。"]],"img":"slides/007.jpg"},{"scene":"idea","ch":1,"title":"The Whole Idea First","zh":"先说结论","t":65.92,"lines":[["Marker 1: a machine can die halfway.","标记 1：一台机器可能做到一半就死了。"]],"img":"slides/008.jpg"},{"scene":"idea","ch":1,"title":"The Whole Idea First","zh":"先说结论","t":70.69,"lines":[["Marker 2: two machines can write the same file at once.","标记 2：两台机器可能同时写同一个文件。"]],"img":"slides/009.jpg"},{"scene":"idea","ch":1,"title":"The Whole Idea First","zh":"先说结论","t":76.67,"lines":[["Marker 3: a message can vanish, and the sender can't tell what happened.","标记 3：一条消息可能消失，发的人分不清发生了什么。"]],"img":"slides/010.jpg"},{"scene":"idea","ch":1,"title":"The Whole Idea First","zh":"先说结论","t":83.53,"lines":[["Marker 4: copies of the one record that matters must agree.","标记 4：那份最重要的记录，各个副本必须一致。"]],"img":"slides/011.jpg"},{"scene":"idea","ch":1,"title":"The Whole Idea First","zh":"先说结论","t":89.51,"lines":[["And on the right, the five labs. Each one fights one or more of these markers.","右边是五个 Lab，每个都在对付其中一个或几个标记。"]],"img":"slides/012.jpg"},{"scene":"one","ch":2,"title":"One Machine","zh":"一台机器","t":99.57,"lines":[["Start with the version that needs no network at all: mrsequential.go.","先看完全不用网络的版本：mrsequential.go。"]],"img":"slides/013.jpg"},{"scene":"one","ch":2,"title":"One Machine","zh":"一台机器","t":105.55,"lines":[["The lab hands it to you as the reference answer. It runs everything in one process.","Lab 把它作为参考答案发给你，所有事都在一个进程里做完。"],["The counting logic lives in a plugin, wc.go: a file of Map and Reduce functions loaded at run time.","计数逻辑在插件 wc.go 里：一个装着 Map 和 Reduce 函数、运行时才加载的文件。"]],"img":"slides/014.jpg"},{"scene":"one","ch":2,"title":"One Machine","zh":"一台机器","t":123.17,"lines":[["Map gets one book's text. It splits on anything that isn't a letter.","Map 拿到一本书的全文，在所有非字母处切开。"],["It emits one pair per word: the word, and \"1\".","每个词吐出一对：这个词，和 \"1\"。"]],"img":"slides/015.jpg"},{"scene":"one","ch":2,"title":"One Machine","zh":"一台机器","t":135.57,"lines":[["mrsequential loops over the files and appends every pair to one slice, intermediate.","mrsequential 逐个文件读，把所有词对追加进同一个切片 intermediate。"]],"img":"slides/016.jpg"},{"scene":"one","ch":2,"title":"One Machine","zh":"一台机器","t":142.42,"lines":[["Then it sorts that slice by key, so equal words sit next to each other.","然后按键排序，相同的词就挨在一起。"]],"img":"slides/017.jpg"},{"scene":"one","ch":2,"title":"One Machine","zh":"一台机器","t":150.14,"lines":[["For each run of equal keys it calls Reduce, which in wc.go just counts the values.","每一段相同的键调用一次 Reduce；wc.go 里的 Reduce 只是数一下有几个值。"]],"img":"slides/018.jpg"},{"scene":"one","ch":2,"title":"One Machine","zh":"一台机器","t":158.3,"lines":[["Each result becomes one line of mr-out-0: the word, a space, the count.","每个结果写成 mr-out-0 的一行：词、空格、次数。"]],"img":"slides/019.jpg"},{"scene":"run","ch":3,"title":"The Real Run","zh":"真实运行","t":167.05,"lines":[["Here is the real run on the eight books in src/main.","这是在 src/main 那八本书上的真实运行。"],["3.3 megabytes of text. 623,948 words. 22,107 different ones.","3.3 MB 文本，623,948 个词，其中 22,107 个不同的词。"],["The top word is \"the\", 29,748 times.","最多的是 \"the\"，29,748 次。"],["And the whole job takes a fraction of a second on one laptop.","整个任务在一台笔记本上只要零点几秒。"]],"img":"slides/020.jpg"},{"scene":"run","ch":3,"title":"The Real Run","zh":"真实运行","t":189.4,"lines":[["So, a fair question: why would anyone use more than one machine?","那么问题来了：为什么还要用不止一台机器？"]],"img":"slides/021.jpg"},{"scene":"scale","ch":4,"title":"Now Make It a Terabyte","zh":"换成 1 TB","t":199.72,"lines":[["Because real inputs are not 3.3 megabytes. Google's were terabytes.","因为真实的输入不是 3.3 MB。Google 的输入是 TB 级。"],["Scale our run by hand: one terabyte is about 300,000 times bigger.","按比例手算一下：1 TB 大约是它的 30 万倍。"],["At the same speed, that's over ten hours on one machine. Worked out, not measured.","按同样的速度，一台机器要超过十个小时。这是推算，不是实测。"]],"img":"slides/022.jpg"},{"scene":"scale","ch":4,"title":"Now Make It a Terabyte","zh":"换成 1 TB","t":219.4,"lines":[["Worse: mrsequential keeps every pair in memory. A terabyte of pairs won't fit.","更糟的是：mrsequential 把所有词对放在内存里，1 TB 的词对根本装不下。"]],"img":"slides/023.jpg"},{"scene":"scale","ch":4,"title":"Now Make It a Terabyte","zh":"换成 1 TB","t":226.25,"lines":[["The MapReduce paper reports a grep over one terabyte on about 1,800 machines, in about 150 seconds.","MapReduce 论文报告：在约 1800 台机器上 grep 1 TB 数据，用时约 150 秒。"],["That's the goal: speed from many machines. Now let's see what it costs.","这就是目标：靠很多台机器换速度。下面看看要付出什么代价。"]],"img":"slides/024.jpg"},{"scene":"nothing","ch":5,"title":"Two Machines Share Nothing","zh":"两台机器什么都不共享","t":243.9,"lines":[["First, the one fact that makes everything else hard.","先说一个让后面一切都变难的事实。"],["Two machines, A and B. Each has its own memory. B cannot read A's slice.","两台机器 A 和 B，各有各的内存。B 读不到 A 的切片。"],["The only link between them is the network. All they can do is send messages.","它们之间唯一的联系是网络，能做的只有发消息。"],["So A asks B for work the way a program calls a function, except the call travels as a message.","所以 A 让 B 干活，就像程序调用一个函数，只不过这次调用是作为一条消息发出去的。"],["That's a remote procedure call, RPC: send the arguments, wait for a reply message.","这叫远程过程调用，RPC：把参数发过去，等一条回复消息。"],["In one process, a call always returns. Across a network, the reply might never come.","在一个进程里，调用总会返回；跨网络时，回复可能永远不来。"]],"img":"slides/025.jpg"},{"scene":"nothing","ch":5,"title":"Two Machines Share Nothing","zh":"两台机器什么都不共享","t":289.36,"lines":[["Hold on to that. All four markers grow out of it.","记住这一点，四个标记都从这里长出来。"]],"img":"slides/026.jpg"},{"scene":"split","ch":6,"title":"Split the Work","zh":"把活分出去","t":297.24,"lines":[["The obvious plan: one coordinator hands out books, workers count them.","最直接的方案：一个协调者分发书，几个 worker 去数。"],["The coordinator is the machine that holds the to-do list and hands out tasks.","协调者就是手里拿着任务清单、负责分活的那台机器。"],["A worker is a machine that asks for a task, does it, and reports back, all by RPC.","worker 是来要任务、做完、再回报的机器，全都通过 RPC。"]],"img":"slides/027.jpg"},{"scene":"split","ch":6,"title":"Split the Work","zh":"把活分出去","t":319.54,"lines":[["Eight books, so eight map tasks, spread over a few workers.","八本书，就是八个 map 任务，分给几个 worker。"],["On paper, this is just mrsequential's loop with the iterations on different machines.","纸面上，这就是把 mrsequential 的循环拆到不同机器上跑。"]],"img":"slides/028.jpg"},{"scene":"split","ch":6,"title":"Split the Work","zh":"把活分出去","t":332.37,"lines":[["In practice, every marker on our page now becomes possible. One at a time.","实际上，图上的每个标记现在都可能发生。一个一个来。"]],"img":"slides/029.jpg"},{"scene":"fail","ch":7,"title":"1 · A Worker Dies","zh":"难题 1 · worker 挂了","t":341.56,"lines":[["Worker 2 is halfway through Frankenstein, and its machine loses power.","worker 2 数《弗兰肯斯坦》数到一半，机器断电了。"]],"img":"slides/030.jpg"},{"scene":"fail","ch":7,"title":"1 · A Worker Dies","zh":"难题 1 · worker 挂了","t":347.54,"lines":[["In one process, a crash ends everything, so there's nothing half-done to clean up.","在单进程里，一崩就全没了，不存在“做了一半”的状态。"]],"img":"slides/031.jpg"},{"scene":"fail","ch":7,"title":"1 · A Worker Dies","zh":"难题 1 · worker 挂了","t":354.83,"lines":[["Here, the other seven books are fine. Only this task is lost.","这里，另外七本书没事，只丢了这一个任务。"]],"img":"slides/032.jpg"},{"scene":"fail","ch":7,"title":"1 · A Worker Dies","zh":"难题 1 · worker 挂了","t":361.25,"lines":[["Toy: the coordinator watches a clock. Worker 2 has been quiet for a while. Is it dead?","玩具例子：协调者盯着一个钟，worker 2 已经好一阵没动静了。它死了吗？"],["It can't know. A dead worker and a slow worker send exactly the same thing: nothing.","它没法知道。死掉的 worker 和慢的 worker 发来的东西一模一样：什么都没有。"]],"img":"slides/033.jpg"},{"scene":"fail","ch":7,"title":"1 · A Worker Dies","zh":"难题 1 · worker 挂了","t":380,"lines":[["The Lab 1 tests make both happen on purpose, with a plugin called crash.go.","Lab 1 的测试故意让这两种情况都发生，用的是一个叫 crash.go 的插件。"]],"img":"slides/034.jpg"},{"scene":"fail","ch":7,"title":"1 · A Worker Dies","zh":"难题 1 · worker 挂了","t":387.28,"lines":[["It kills a third of its Map and Reduce calls, and stalls another third for up to 10 seconds.","它让三分之一的 Map / Reduce 调用直接退出，另外三分之一卡住最多 10 秒。"],["How the coordinator recovers is episode 3.","协调者怎么恢复，第 3 集讲。"]],"img":"slides/035.jpg"},{"scene":"conc","ch":8,"title":"2 · Two Writers, One File","zh":"难题 2 · 两个人写同一个文件","t":403.04,"lines":[["Say the coordinator gives up on worker 2 and hands Frankenstein to worker 3.","假设协调者放弃了 worker 2，把《弗兰肯斯坦》交给 worker 3。"]],"img":"slides/036.jpg"},{"scene":"conc","ch":8,"title":"2 · Two Writers, One File","zh":"难题 2 · 两个人写同一个文件","t":410.33,"lines":[["But worker 2 was only slow, not dead. Now both are counting the same book.","可 worker 2 只是慢，没有死。现在两个人在数同一本书。"],["Both write the same output file, at the same time.","两个人同时写同一个输出文件。"],["A reader could see half of one and half of the other: \"Frankenstein\" counted 30 times, or 60, or 17.","读的人可能看到一半来自这个、一半来自那个：“Frankenstein”可能数成 30、60，或者 17。"],["That's concurrency: two things running at once, touching the same data.","这就是并发：两件事同时进行，碰同一份数据。"]],"img":"slides/037.jpg"},{"scene":"conc","ch":8,"title":"2 · Two Writers, One File","zh":"难题 2 · 两个人写同一个文件","t":439.48,"lines":[["Inside one machine, the same thing happens between threads, and Go's race detector catches it.","在一台机器内部，线程之间也会这样，Go 的竞争检测器能抓到。"],["Atomic rename is episode 3; locks and races are episode 4.","原子改名在第 3 集讲，锁和竞争在第 4 集讲。"]],"img":"slides/038.jpg"},{"scene":"net","ch":9,"title":"3 · Did It Arrive?","zh":"难题 3 · 消息到了吗","t":455.08,"lines":[["Back to our RPC. Every step so far is a message, and messages can be lost.","回到 RPC。到目前为止每一步都是一条消息，而消息会丢。"],["The labs simulate the network with labrpc, a fake network inside one process.","Lab 用 labrpc 模拟网络：一个进程里的“假网络”。"],["Call sends a request and returns true only if a reply came back.","Call 发出请求，只有收到回复才返回 true。"]],"img":"slides/039.jpg"},{"scene":"net","ch":9,"title":"3 · Did It Arrive?","zh":"难题 3 · 消息到了吗","t":476.95,"lines":[["In unreliable mode, processReq, which delivers each request, drops it 10% of the time.","在不可靠模式下，负责投递请求的 processReq 有 10% 的概率丢掉它。"],["And after the handler has run, it drops the reply another 10% of the time.","处理函数执行完以后，它还会再以 10% 的概率丢掉回复。"]],"img":"slides/040.jpg"},{"scene":"net","ch":9,"title":"3 · Did It Arrive?","zh":"难题 3 · 消息到了吗","t":491.95,"lines":[["Both cases end the same way: Call returns false.","两种情况的结局一样：Call 返回 false。"]],"img":"slides/041.jpg"},{"scene":"net","ch":9,"title":"3 · Did It Arrive?","zh":"难题 3 · 消息到了吗","t":497.07,"lines":[["So when you see false, did the server do the work or not?","所以看到 false 时，服务器到底做了没有？"]],"img":"slides/042.jpg"},{"scene":"net","ch":9,"title":"3 · Did It Arrive?","zh":"难题 3 · 消息到了吗","t":505.92,"lines":[["You can't tell. That one fact shapes the whole KV lab, episodes 5 and 8.","你分不出来。这一个事实决定了整个 KV Lab 的设计，第 5 集和第 8 集讲。"]],"img":"slides/043.jpg"},{"scene":"sofar","ch":10,"title":"So Far, on the Page","zh":"小结（在图上）","t":515.54,"lines":[["So far, on our page: band A has no markers. Nothing on it can half-fail.","到目前为止，在这张图上：A 带没有标记，那上面没有什么会“坏一半”。"]],"img":"slides/044.jpg"},{"scene":"sofar","ch":10,"title":"So Far, on the Page","zh":"小结（在图上）","t":523.26,"lines":[["Band B has three already: a dead worker, two writers, a lost message.","B 带已经有三个了：死掉的 worker、两个写的人、丢掉的消息。"]],"img":"slides/045.jpg"},{"scene":"sofar","ch":10,"title":"So Far, on the Page","zh":"小结（在图上）","t":530.12,"lines":[["All three come from one fact: machines share nothing and only send messages.","三个都来自同一个事实：机器之间什么都不共享，只能发消息。"]],"img":"slides/046.jpg"},{"scene":"sofar","ch":10,"title":"So Far, on the Page","zh":"小结（在图上）","t":537.27,"lines":[["One marker left, and it's about the coordinator itself.","还剩一个标记，关于协调者本身。"]],"img":"slides/047.jpg"},{"scene":"agree","ch":11,"title":"4 · The Coordinator Dies","zh":"难题 4 · 协调者挂了","t":544.28,"lines":[["Workers can be replaced. The coordinator can't: it holds the only record of which tasks are done.","worker 可以换人，协调者不行：只有它记着哪些任务做完了。"]],"img":"slides/048.jpg"},{"scene":"agree","ch":11,"title":"4 · The Coordinator Dies","zh":"难题 4 · 协调者挂了","t":552.87,"lines":[["The natural fix: keep a copy of that record on three machines. Each copy is a replica.","自然的办法是把这份记录在三台机器上各存一份。每一份叫一个副本。"]],"img":"slides/049.jpg"},{"scene":"agree","ch":11,"title":"4 · The Coordinator Dies","zh":"难题 4 · 协调者挂了","t":561.46,"lines":[["Toy: three notebooks. One says \"task 6 done\". The other two never heard. Which one is right?","玩具例子：三本笔记本。一本写着“任务 6 做完了”，另外两本没收到。哪本是对的？"],["Nobody can say, so the copies must agree on every entry, even while machines crash and messages get lost.","谁也说不清，所以副本必须对每一条都达成一致，哪怕机器在崩、消息在丢。"],["Now cut the network between notebook one and the other two. Both sides keep working.","现在把第一本和另外两本之间的网络切断。两边都还在工作。"],["They must not both think they're in charge, or the record splits in two.","两边不能都以为自己说了算，否则记录就分裂成两份。"]],"img":"slides/050.jpg"},{"scene":"agree","ch":11,"title":"4 · The Coordinator Dies","zh":"难题 4 · 协调者挂了","t":596.52,"lines":[["Getting copies to agree like this is called consensus: Paxos in episodes 13 and 14, Raft from episode 15.","让副本这样达成一致，叫做共识：Paxos 在第 13、14 集，Raft 从第 15 集开始。"]],"img":"slides/051.jpg"},{"scene":"labs","ch":12,"title":"Five Labs on One Board","zh":"五个 Lab 对上这块板子","t":607.88,"lines":[["Lab 1, MapReduce, is the job we just split: markers 1 and 2, crashed workers and duplicate writers.","Lab 1 MapReduce 就是刚才拆开的任务：标记 1 和 2，worker 崩溃、重复写入。"]],"img":"slides/052.jpg"},{"scene":"labs","ch":12,"title":"Five Labs on One Board","zh":"五个 Lab 对上这块板子","t":616.91,"lines":[["Lab 2, a key-value server, lives entirely in marker 3: what to do when Call says false.","Lab 2 键值服务器整个都在标记 3 里：Call 返回 false 时该怎么办。"]],"img":"slides/053.jpg"},{"scene":"labs","ch":12,"title":"Five Labs on One Board","zh":"五个 Lab 对上这块板子","t":625.5,"lines":[["Lab 3, Raft, is marker 4: replicas that agree despite crashes and lost messages.","Lab 3 Raft 是标记 4：机器崩、消息丢，副本照样一致。"]],"img":"slides/054.jpg"},{"scene":"labs","ch":12,"title":"Five Labs on One Board","zh":"五个 Lab 对上这块板子","t":632.79,"lines":[["Lab 4 puts the key-value service on top of Raft, so it survives crashes.","Lab 4 把键值服务放到 Raft 上，让它挺过崩溃。"]],"img":"slides/055.jpg"},{"scene":"labs","ch":12,"title":"Five Labs on One Board","zh":"五个 Lab 对上这块板子","t":640.08,"lines":[["Lab 5 shards it across groups, to win back the speed we started for.","Lab 5 把它分片到多个组，把最初想要的速度赢回来。"]],"img":"slides/056.jpg"},{"scene":"src","ch":13,"title":"Finding Your Way in src/","zh":"在 src/ 里认路","t":649.26,"lines":[["Everything lives in src/. Some folders are given to you; you never edit them.","所有代码都在 src/ 里。有些目录是发给你的，你不用改。"]],"img":"slides/057.jpg"},{"scene":"src","ch":13,"title":"Finding Your Way in src/","zh":"在 src/ 里认路","t":656.55,"lines":[["labrpc is the fake network. tester1 runs your servers, crashes them and checks them.","labrpc 是假网络。tester1 负责启动、弄崩、检查你的服务器。"]],"img":"slides/058.jpg"},{"scene":"src","ch":13,"title":"Finding Your Way in src/","zh":"在 src/ 里认路","t":663.84,"lines":[["mrapps holds the plugins, like wc.go. main holds the books and the little launchers.","mrapps 放插件，比如 wc.go；main 放那几本书和启动程序。"]],"img":"slides/059.jpg"},{"scene":"src","ch":13,"title":"Finding Your Way in src/","zh":"在 src/ 里认路","t":671.12,"lines":[["Your files are the ones with comments like \"Your code here\". There are ten of them.","你要写的文件，就是带着 \"Your code here\" 这类注释的那些，一共十个。"]],"img":"slides/060.jpg"},{"scene":"src","ch":13,"title":"Finding Your Way in src/","zh":"在 src/ 里认路","t":679.28,"lines":[["For Lab 1, that's mr/coordinator.go and mr/worker.go. Right now MakeCoordinator only starts its RPC server.","Lab 1 是 mr/coordinator.go 和 mr/worker.go。现在 MakeCoordinator 只启动了 RPC 服务，别的都要你写。"]],"img":"slides/061.jpg"},{"scene":"src","ch":13,"title":"Finding Your Way in src/","zh":"在 src/ 里认路","t":687,"lines":[["make mr builds the launchers and the plugins, then runs the Lab 1 tests with the race detector on.","make mr 会编译启动程序和插件，然后打开竞争检测器跑 Lab 1 的测试。"]],"img":"slides/062.jpg"},{"scene":"recap","ch":14,"title":"Recap, on the Page","zh":"本集要点（在图上）","t":698.36,"lines":[["One: one machine does our eight books in a fraction of a second. We distribute for scale, not for small jobs.","一：一台机器零点几秒数完八本书。分布式是为了规模，不是为了小任务。"]],"img":"slides/063.jpg"},{"scene":"recap","ch":14,"title":"Recap, on the Page","zh":"本集要点（在图上）","t":708.69,"lines":[["Two: the price is four markers: failure, concurrency, an unreliable network, agreement.","二：代价是四个标记：故障、并发、不可靠的网络、一致。"]],"img":"slides/064.jpg"},{"scene":"recap","ch":14,"title":"Recap, on the Page","zh":"本集要点（在图上）","t":715.11,"lines":[["Three: a false from Call can mean \"never ran\" or \"ran, reply lost\". Design for both.","三：Call 返回 false 可能是“没执行”，也可能是“执行了但回复丢了”。两种都要考虑。"]],"img":"slides/065.jpg"},{"scene":"turn","ch":15,"title":"Your Turn","zh":"轮到你","t":725.17,"lines":[["Build wc.so and run mrsequential on the eight books yourself.","自己编译 wc.so，在八本书上跑一遍 mrsequential。"],["Before you look: how many times does \"Sherlock\" appear?","先别看：\"Sherlock\" 出现了几次？"]],"img":"slides/066.jpg"},{"scene":"turn","ch":15,"title":"Your Turn","zh":"轮到你","t":737.83,"lines":[["97. Grep mr-out-0 to check. Next episode: the MapReduce model, one bucket at a time.","97 次。grep 一下 mr-out-0 就能核对。下一集：MapReduce 模型，一个桶一个桶地看。"]],"img":"slides/067.jpg"}],"code":[{"key":"pg-crash","file":"src/mrapps/crash.go","a":23,"b":26,"fn":"maybeCrash","t":66.5,"again":[515,607.25,697.75],"scene":"idea","slide":7},{"key":"pg-drop","file":"src/labrpc/labrpc.go","a":302,"b":349,"fn":"processReq","t":77.25,"again":[515,607.25,697.75],"scene":"idea","slide":9},{"key":"map","file":"src/mrapps/wc.go","a":19,"b":32,"fn":"Map()","t":114,"again":[],"scene":"one","slide":13},{"key":"seqread","file":"src/main/mrsequential.go","a":38,"b":51,"fn":"main()","t":135.75,"again":[],"scene":"one","slide":15},{"key":"seqsort","file":"src/main/mrsequential.go","a":59,"b":62,"fn":"main()","t":142.75,"again":[],"scene":"one","slide":16},{"key":"seqreduce","file":"src/main/mrsequential.go","a":68,"b":84,"fn":"main()","t":150.25,"again":[],"scene":"one","slide":17},{"key":"crash","file":"src/mrapps/crash.go","a":20,"b":32,"fn":"maybeCrash()","t":380.5,"again":[],"scene":"fail","slide":33},{"key":"call","file":"src/labrpc/labrpc.go","a":110,"b":113,"fn":"Call()","t":470.5,"again":[],"scene":"net","slide":38},{"key":"dropreq","file":"src/labrpc/labrpc.go","a":302,"b":306,"fn":"processReq()","t":477.25,"again":[],"scene":"net","slide":39},{"key":"droprep","file":"src/labrpc/labrpc.go","a":344,"b":351,"fn":"processReq()","t":484.75,"again":[],"scene":"net","slide":39},{"key":"mkcoord","file":"src/mr/coordinator.go","a":52,"b":60,"fn":"MakeCoordinator()","t":679.5,"again":[],"scene":"src","slide":60},{"key":"make","file":"src/Makefile","a":43,"b":57,"fn":"mr","t":687.25,"again":[],"scene":"src","slide":61}],"practice":[{"scene":"run","q":["mrsequential 在一台笔记本上零点几秒就数完了八本书。那为什么还要用多台机器？","mrsequential counts all eight books in a fraction of a second on one laptop. Why use more than one machine at all?"],"a":["因为真实输入是 TB 级。1 TB 约是 3.3 MB 的 302,929 倍；按这次运行的 0.14 秒算，要约 11.8 小时；而且 mrsequential 把所有词对放在内存里，根本装不下。","Because real inputs are terabytes. 1 TB is about 302,929 times 3.3 MB; at this run's 0.14 s that is about 11.8 hours, and mrsequential keeps every pair in memory, which would not fit."],"why":["0.14 秒是 data/runs.sh 5 次真实运行的中位数（每次都不到三分之一秒）；11.8 小时是按比例推算的，不是实测。内存问题见 mrsequential.go 第 50 行：所有 Map 输出都追加进 intermediate。","0.14 s is the median of five real runs in data/runs.sh (every one under a third of a second); the 11.8 hours is worked out by scaling, not measured. The memory problem is mrsequential.go line 50: every Map output is appended to intermediate."],"src":["src/main/mrsequential.go:49–50"],"run":"episodes/ep01-why-distributed/data/runs.sh","t":166.15},{"scene":"net","q":["labrpc 的 Call 返回了 false。服务器上的处理函数执行了吗？","labrpc's Call returned false. Did the handler run on the server?"],"a":["分不出来。请求可能在路上被丢了（处理函数没执行），也可能处理函数执行完、回复被丢了。两种情况 Call 都返回 false。","You can't tell. The request may have been dropped on the way (the handler never ran), or the handler ran and the reply was dropped. Call returns false in both cases."],"why":["labrpc.go 第 302–305 行丢请求，第 349–351 行在处理函数返回之后丢回复，两处都发回 replyMsg{false, nil}。","labrpc.go lines 302–305 drop the request; lines 349–351 drop the reply after the handler has returned. Both send replyMsg{false, nil}."],"src":["src/labrpc/labrpc.go:302–305","src/labrpc/labrpc.go:349–351"],"reasoned":true,"t":454.184},{"scene":"turn","q":["\"Sherlock\" 在八本书里一共出现了几次？","How many times does \"Sherlock\" appear across the eight books?"],"a":["97 次。","97 times."],"why":["真实运行的 mr-out-0 里有一行 \"Sherlock 97\"（data/runs.sh）。","The real run's mr-out-0 has the line \"Sherlock 97\" (data/runs.sh)."],"run":"episodes/ep01-why-distributed/data/runs.sh","t":724.267},{"q":["排序以后，\"Genevese\" 和 \"I\" 排在 \"a\" 前面。为什么大写开头的词排在前面？","After sorting, \"Genevese\" and \"I\" come before \"a\". Why do capitalised words come first?"],"a":["ByKey 的 Less 用 Go 的字符串比较 a[i].Key < a[j].Key，按字节比较。大写字母的字节值（'G' = 0x47）小于小写字母（'a' = 0x61）。","ByKey's Less compares with Go's string <, byte by byte. Capital letters have smaller byte values ('G' = 0x47) than lower-case ones ('a' = 0x61)."],"why":["mrsequential.go 第 22 行定义 Less；data.py 检查了那句话排序后的顺序：Genevese、I、a、am…","mrsequential.go line 22 defines Less; data.py checks the sentence's sorted order: Genevese, I, a, am …"],"src":["src/main/mrsequential.go:22"],"run":"episodes/ep01-why-distributed/data/runs.sh"},{"q":["\"Frankenstein\" 一共出现 30 次。如果让两个 worker 各数一遍这本书，再把两份结果加在一起，会得到多少？","\"Frankenstein\" appears 30 times. If two workers each count that book and both results get added together, what comes out?"],"a":["60。30 次全部来自 pg-frankenstein.txt 这一本书，重复数一遍就整本翻倍。这就是第 3 集要防止的“重复写入”。","60. All 30 come from the one book pg-frankenstein.txt, so counting it twice doubles it. This is the duplicate write episode 3 has to prevent."],"why":["data/runs.sh 对每本书单独跑了一次 mrsequential：只有 pg-frankenstein.txt 里有 \"Frankenstein\"，正好 30 次。","data/runs.sh runs mrsequential on each book separately: only pg-frankenstein.txt contains \"Frankenstein\", exactly 30 times."],"run":"episodes/ep01-why-distributed/data/runs.sh"},{"q":["不可靠模式下，labrpc 以 10% 的概率丢请求，再以 10% 的概率丢回复（服务器不崩的情况下）。大约多少比例的 Call 返回 false？其中处理函数其实执行了的占多少？","In unreliable mode labrpc drops 10% of requests, then 10% of replies (with no server crashes). Roughly what share of Calls return false? Of those, how many had actually run the handler?"],"a":["约 19%：10% 丢在请求上，再加剩下 90% 里的 10% = 9% 丢在回复上。返回 false 的调用里，约 9 / 19 ≈ 47% 其实执行过。","About 19%: 10% lost as requests, plus 10% of the remaining 90% = 9% lost as replies. Of the false results, about 9 / 19 ≈ 47% had actually run."],"why":["按 labrpc.go 第 302 行和第 349 行的两个 (rand.Int()%1000) < 100 推算；没有用真实运行验证。","Worked out from the two (rand.Int()%1000) < 100 checks at labrpc.go lines 302 and 349; not checked against a real run."],"src":["src/labrpc/labrpc.go:302","src/labrpc/labrpc.go:349"],"reasoned":true}],"practiceKind":"code","sections":null};

<style>

}

:root[data-theme="dark"]{

*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0; background:var(--bg); color:var(--ink); font:15px/1.6 var(--f-sans); -webkit-font-smoothing:antialiased; overflow-wrap:anywhere}  /* long identifiers (CURRENT_CTL_CONFIG_PWM_DUTY_CYCLE_MAX) must not widen the page at phone width */
.wrap{max-width:1320px; margin:0 auto; padding-inline:20px; padding-block:36px 72px; display:flex; flex-direction:column; gap:28px}
h1,h2,h3{margin:0; text-wrap:balance}
p{margin:0}
:focus-visible{outline:2px solid var(--acc); outline-offset:2px}
a{color:inherit}

.hero{background:var(--tile); border:1px solid var(--edge); border-radius:22px; padding:28px 30px; display:flex; flex-direction:column; gap:12px}
.hero-top{display:flex; align-items:center; gap:10px; margin-bottom:4px}
.home{font:500 13px var(--f-sans); color:var(--mute); text-decoration:none; padding:6px 12px; border-radius:10px; background:var(--soft)}
.home:hover{color:var(--ink)}
.lang{margin-left:auto; display:inline-flex; padding:3px; gap:2px; border-radius:999px; background:var(--soft); border:0; cursor:pointer; font:600 12px/1 var(--f-mono); color:var(--mute)}
.lang span{padding:5px 9px; border-radius:999px}
.lang span.on{background:var(--ink); color:var(--bg)}
.eyebrow{font:500 13px var(--f-mono); color:var(--acc)}
h1{font-size:clamp(32px,4.4vw,52px); font-weight:600; letter-spacing:-.03em; line-height:1.08}
.lead{color:var(--ink-2); max-width:62ch}
.acts{display:flex; flex-wrap:wrap; gap:8px; margin-top:6px}
.go{display:inline-flex; align-items:center; gap:6px; text-decoration:none; border-radius:12px; padding:9px 14px; font:500 14px var(--f-sans); background:var(--soft); color:var(--ink); border:0; cursor:pointer}
.go:hover{background:var(--edge)}
.go.main{background:var(--ink); color:var(--bg)}
.num{font-family:var(--f-mono); font-variant-numeric:tabular-nums}

.toc{position:sticky; top:0; z-index:2; display:flex; gap:6px; overflow-x:auto; padding:10px 0; background:var(--bg); scrollbar-width:thin}
.toc a{flex:none; text-decoration:none; font:500 13px var(--f-sans); color:var(--ink-2); background:var(--tile); border:1px solid var(--edge); border-radius:999px; padding:6px 12px; white-space:nowrap}
.toc a .num{color:var(--faint); margin-right:6px}
.toc a.on{background:var(--acc-soft); box-shadow:inset 0 0 0 1.5px var(--acc); border-color:transparent; color:var(--ink)}

.chap{display:flex; flex-direction:column; gap:14px; scroll-margin-top:64px}
.chap > header{display:flex; align-items:baseline; gap:12px; padding:8px 4px 0}
.chap > header .num{font-size:14px; color:var(--acc)}
.chap > header h2{font-size:24px; font-weight:600; letter-spacing:-.02em}
.chap > header small{color:var(--mute); font-size:14px}
.slide{display:grid; grid-template-columns:minmax(0,1.7fr) minmax(0,1fr); gap:0; background:var(--tile); border:1px solid var(--edge); border-radius:22px; overflow:hidden}
.slide img{display:block; width:100%; aspect-ratio:16/9; background:#070b16; cursor:zoom-in}
.notes{padding:20px 22px; display:flex; flex-direction:column; gap:12px}
.notes .meta{display:flex; gap:10px; align-items:center; font:500 12px var(--f-mono); color:var(--faint)}
.notes .meta a{color:var(--acc); text-decoration:none; background:var(--acc-soft); border-radius:8px; padding:3px 8px}
.line .a{color:var(--ink); font-size:15.5px}
.line .b{color:var(--mute); font-size:13.5px; margin-top:2px}
.zoom{position:fixed; inset:0; z-index:9; background:rgba(0,0,0,.88); display:flex; align-items:center; justify-content:center; padding:16px; cursor:zoom-out}
.zoom img{max-width:100%; max-height:100%; border-radius:8px}
/* code index + practice: the two pages that close the 课件 */
.extra{display:flex; flex-direction:column; gap:14px; scroll-margin-top:64px}
.extra > header{display:flex; align-items:baseline; gap:12px; padding:8px 4px 0; flex-wrap:wrap}
.extra > header h2{font-size:24px; font-weight:600; letter-spacing:-.02em}
.extra > header small{color:var(--mute); font-size:14px}
.tile{background:var(--tile); border:1px solid var(--edge); border-radius:22px; padding:8px 0; overflow-x:auto}
.cix{width:100%; border-collapse:collapse; font-size:14px}
.cix th{text-align:left; font:500 12px var(--f-mono); color:var(--faint); padding:10px 14px; border-bottom:1px solid var(--edge)}
.cix td{padding:10px 14px; border-bottom:1px solid var(--edge); vertical-align:top}
.cix tr:last-child td{border-bottom:0}
.cix .f{font-family:var(--f-mono); font-size:13px; color:var(--ink); word-break:break-all}
.cix .f b{font-weight:600}
.cix .fn{font-family:var(--f-mono); font-size:13px; color:var(--acc)}
.cix .where{color:var(--ink-2)} .cix .where small{display:block; color:var(--mute); font-size:12.5px}
.cix a{color:var(--acc); text-decoration:none; font-family:var(--f-mono); font-size:12.5px; background:var(--acc-soft); border-radius:8px; padding:2px 7px; white-space:nowrap; display:inline-block; margin:0 4px 4px 0}
.qs{display:flex; flex-direction:column; gap:12px}
.q{background:var(--tile); border:1px solid var(--edge); border-radius:22px; padding:20px 22px; display:flex; flex-direction:column; gap:10px}
.q .meta{display:flex; gap:8px; align-items:center; flex-wrap:wrap; font:500 12px var(--f-mono); color:var(--faint)}
.chip{font:500 12px var(--f-sans); border-radius:999px; padding:3px 9px; background:var(--soft); color:var(--ink-2)}
.chip.new{background:var(--acc-soft); color:var(--acc)}
.chip.reasoned{background:transparent; box-shadow:inset 0 0 0 1px var(--edge-2); color:var(--mute)}
.q .meta a{color:var(--acc); text-decoration:none; background:var(--acc-soft); border-radius:8px; padding:3px 8px}
.q .ask{font-size:16px; color:var(--ink)} .q .ask small{display:block; color:var(--mute); font-size:13.5px; margin-top:2px}
.q details{border-top:1px solid var(--edge); padding-top:10px}
.q summary{cursor:pointer; font:500 14px var(--f-sans); color:var(--acc); list-style:none} .q summary::-webkit-details-marker{display:none}
.q .ans{margin-top:8px; display:flex; flex-direction:column; gap:8px}
.q .ans .a{color:var(--ink)} .q .ans .b{color:var(--mute); font-size:13.5px}
.q .why{background:var(--soft); border-radius:14px; padding:10px 14px; font-size:14px; color:var(--ink-2)}
.q .why .lab{font:500 12px var(--f-mono); color:var(--faint); display:block; margin-bottom:2px}
.q code{font-family:var(--f-mono); font-size:12.5px; background:var(--soft-2); border:1px solid var(--edge); border-radius:6px; padding:1px 6px; word-break:break-all}
@media (max-width:760px){ .slide{grid-template-columns:1fr} .hero{padding:22px 20px}
  .cix thead{display:none} .cix tr{display:grid; grid-template-columns:28px minmax(0,1fr); column-gap:6px; padding:12px 14px; border-bottom:1px solid var(--edge)}
  .cix tr:last-child{border-bottom:0} .cix td{display:block; padding:0; border:0; grid-column:2} .cix td:first-child{grid-column:1; grid-row:1 / span 4}
  .cix .fn{word-break:break-all; margin-top:2px} .cix .where{margin-top:4px} }

/* Handout: one slide per A4 landscape page, notes in both languages (slides.mjs prints ?print to slides.pdf) */
@page{size:A4 landscape; margin:10mm}
@media print{
  body{background:#fff; color:#141414}
  .wrap{padding:0; gap:0; max-width:none}
  .hero,.toc,.chap > header,.zoom,.meta a{display:none!important}
  .chap{gap:0}
  /* one page per slide: the picture gives up height so up to --max-lines 6 of notes always fit (no clipping) */
  .slide{display:flex; flex-direction:column; border:0; border-radius:0; break-after:page; break-inside:avoid; height:189mm}
  .slide img{flex:0 1 136mm; min-height:60mm; width:100%; height:auto; aspect-ratio:auto; object-fit:contain; background:none; cursor:auto}
  .notes{flex:none; padding:4mm 2mm 0; gap:5px}
  .notes .meta{color:#6E6E73}
  .line .a{font-size:11pt; color:#141414} .line .b{font-size:9.5pt; color:#3F3F46}
  .extra{break-before:page; gap:4mm} .extra > header{display:flex!important; padding:0}
  .tile,.q{border:1px solid #D6D6D2; border-radius:8px; break-inside:avoid; background:#fff} .tile{overflow:visible}
  .cix{font-size:9pt} .cix td,.cix th{padding:4px 8px} .cix a{background:none; padding:0}
  .q{padding:4mm 5mm; gap:2mm} .q summary{display:none} .q .why{background:#F5F5F3}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="hero-top"><a class="home" id="homeLink" href="../../index.html#ep01" hidden data-en="← Course home">← 课程首页</a><button class="lang" id="langBtn" type="button"></button></div>
    <p class="eyebrow" data-en="Distributed Systems, Read Closely · Episode 1 · Slides">分布式系统从零读懂 · 第 1 集 · 课件</p>
    <h1 data-en="Why Distributed Is Hard: Counting Eight Books">分布式系统难在哪：一台机器数完八本书</h1>
    <p class="lead" id="lead"></p>
    <div class="acts"><a class="go main" href="slides.pdf" download data-en="Download PDF">下载 PDF</a><button class="go" type="button" onclick="print()" data-en="Print">打印</button></div>
  </header>
  <nav class="toc" id="toc" aria-label="章节" data-en-label="Chapters"></nav>
  <main id="chapters" style="display:flex; flex-direction:column; gap:36px"></main>
  <section class="extra" id="code-index" hidden></section>
  <section class="extra" id="paper-map" hidden></section>
  <section class="extra" id="practice" hidden></section>
</div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const mmss = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
if (EN) document.querySelectorAll('[data-en]').forEach(e => e.innerHTML = e.dataset.en);
if (EN) document.querySelectorAll('[data-en-label]').forEach(e => e.setAttribute('aria-label', e.dataset.enLabel));
if (EN) document.title = $('h1').textContent + ' · Slides';  // read from the DOM: a title may contain quotes
$('#langBtn').innerHTML = `<span class="${EN ? '' : 'on'}">中</span><span class="${EN ? 'on' : ''}">EN</span>`;
$('#langBtn').addEventListener('click', () => { try { localStorage.setItem('course.lang', EN ? 'zh' : 'en'); } catch {} location.reload(); });
// links back into the course site only work when served by it (not from the episode folder on file://)
const SITE = location.protocol !== 'file:';
$('#homeLink').hidden = !SITE;
$('#lead').textContent = L(`视频的 ${DATA.slides.length} 张截图，按章节排好，每张旁边是那一段的讲解（${mmss(DATA.total)} 视频）。点图片看大图，点时间从那里开始播放视频。`,
  `${DATA.slides.length} screenshots of the video, by chapter, each with the narration of that moment (${mmss(DATA.total)} of video). Click a picture to enlarge it, a time to play the video from there.`);
const title = c => PRINT ? `${c.zh} · ${c.title}` : L(c.zh, c.title);
const chaps = DATA.chapters.map(c => ({...c, slides: DATA.slides.filter(s => s.scene === c.id)})).filter(c => c.slides.length);
$('#toc').innerHTML = chaps.map(c => `<a href="#c-${esc(c.id)}"><span class="num">${String(c.n).padStart(2, '0')}</span>${esc(title(c))}</a>`).join('');
$('#chapters').innerHTML = chaps.map(c => `<section class="chap" id="c-${esc(c.id)}">
  <header><span class="num">${String(c.n).padStart(2, '0')}</span><h2>${esc(title(c))}</h2><small>${esc(EN ? c.zh : c.title)}</small></header>
  ${c.slides.map(s => `<article class="slide" id="s-${DATA.slides.indexOf(s) + 1}"><img src="${esc(s.img)}" alt="${esc(title(c))}" loading="${PRINT ? 'eager' : 'lazy'}">
    <div class="notes"><div class="meta"><span class="num">${String(DATA.slides.indexOf(s) + 1).padStart(3, '0')} · ${esc(title(c))}</span>${SITE ? `<a class="num" href="../../index.html#ep01@${Math.floor(s.t)}">▶ ${mmss(s.t)}</a>` : `<span class="num">${mmss(s.t)}</span>`}</div>
      ${s.lines.map(([en, zh]) => `<div class="line"><div class="a">${esc(EN ? en : zh)}</div><div class="b">${esc(EN ? zh : en)}</div></div>`).join('')}</div></article>`).join('')}
</section>`).join('');
// in print (the PDF) labels carry both languages, like the slide notes
const L2 = (zh, en) => PRINT ? (zh && en ? `${zh} · ${en}` : zh || en) : L(zh, en);
// code index: every code pane of the video, in order of appearance
const chapOf = id => DATA.chapters.find(c => c.id === id);
const play = t => SITE ? `<a href="../../index.html#ep01@${Math.floor(t)}">▶ ${mmss(t)}</a>` : `<span class="num">${mmss(t)}</span> `;
if (DATA.code && DATA.code.length) {
  const loc = c => { if (!c.file) return `<b>${esc(c.title)}</b>`; const i = c.file.lastIndexOf('/') + 1;
    return `${esc(c.file.slice(0, i))}<b>${esc(c.file.slice(i))}</b>${c.a ? ` · L${c.a}${c.b && c.b !== c.a ? '–' + c.b : ''}` : ''}`; };
  $('#code-index').hidden = false;
  $('#code-index').innerHTML = `<header><h2>${L2('代码索引', 'Code index')}</h2><small>${L2(`视频里出现的 ${DATA.code.length} 段源码，按出场顺序。对着文件和行号打开源码，就是视频里那几行。`, `The ${DATA.code.length} source excerpts shown in the video, in order of appearance. Open the file at these lines and you see exactly what the video showed.`)}</small></header>
  <div class="tile"><table class="cix"><thead><tr><th>#</th><th>${L2('文件 · 行', 'File · lines')}</th><th>${L2('函数', 'Function')}</th><th>${L2('出现在', 'Shown in')}</th><th>${L2('视频', 'Video')}</th></tr></thead><tbody>
  ${DATA.code.map((c, i) => { const ch = chapOf(c.scene); return `<tr><td class="num">${i + 1}</td><td class="f">${loc(c)}</td><td class="fn">${esc(c.fn || '')}</td>
    <td class="where">${esc(title(ch))}<small><a href="#s-${c.slide + 1}">${L2('课件', 'Slide')} ${String(c.slide + 1).padStart(3, '0')}</a></small></td>
    <td>${[c.t, ...c.again].map(play).join('')}</td></tr>`; }).join('')}
  </tbody></table></div>`;
}
// paper map (paper-style courses): which part of the paper each part of the episode covers
if (DATA.sections && DATA.sections.length) {
  $('#paper-map').hidden = false;
  $('#paper-map').innerHTML = `<header><h2>${L2('本集对应原文', 'Paper map')}</h2><small>${L2('这一集讲到的原文章节和图表，以及视频里讲到它的地方。对照原文读，最快。', 'The sections and figures of the paper this episode covers, and where the video covers them. Read them side by side.')}</small></header>
  <div class="tile"><table class="cix"><thead><tr><th>${L2('原文', 'Paper')}</th><th>${L2('本集讲了什么', 'What the episode covers')}</th><th>${L2('视频', 'Video')}</th></tr></thead><tbody>
  ${DATA.sections.map(x => `<tr><td class="f"><b>${esc(x.sec)}</b></td><td>${esc(PRINT ? x.what[0] + ' / ' + x.what[1] : L(x.what[0], x.what[1]))}</td><td>${x.t != null ? play(x.t) : ''}</td></tr>`).join('')}
  </tbody></table></div>`;
}
// practice: the video's guess-first questions plus new ones, each with its answer and what it rests on
const PAPER = DATA.practiceKind === 'paper';
if (DATA.practice && DATA.practice.length) {
  const two = ([zh, en]) => PRINT ? `<div class="a">${esc(zh)}</div><div class="b">${esc(en)}</div>` : `<div class="a">${esc(L(zh, en))}</div><div class="b">${esc(EN ? zh : en)}</div>`;
  $('#practice').hidden = false;
  $('#practice').innerHTML = `<header><h2>${L2('练习', 'Practice')}</h2><small>${PAPER ? L2('先自己答，再看答案。每个答案都写了依据：原文的章节、图表，或者手算。', 'Answer first, then open the answer. Each one says what it rests on: a section or figure of the paper, or a hand calculation.') : L2('先自己答，再看答案。每个答案都写了依据：源码行，或者真实运行。', 'Answer first, then open the answer. Each one says what it rests on: source lines or a real run.')}</small></header>
  <div class="qs">${DATA.practice.map((q, i) => `<article class="q">
    <div class="meta"><span class="num">${L2(`第 ${i + 1} 题`, `Q${i + 1}`)}</span><span class="chip ${q.scene && !q.new ? '' : 'new'}">${q.scene && !q.new ? L2('视频里的题', 'From the video') : L2('新题', 'New')}</span>${q.reasoned ? `<span class="chip reasoned">${PAPER ? L2('按原文推演', 'Worked out from the paper') : L2('按代码推演', 'Worked out from the code')}</span>` : ''}${q.scene && q.t != null ? play(q.t) : ''}</div>
    <div class="ask">${PRINT ? `${esc(q.q[0])}<small>${esc(q.q[1])}</small>` : `${esc(L(q.q[0], q.q[1]))}<small>${esc(EN ? q.q[0] : q.q[1])}</small>`}</div>
    <details${PRINT ? ' open' : ''}><summary>${L2('看答案', 'Show answer')}</summary><div class="ans">${two(q.a)}
      <div class="why"><span class="lab">${L2('依据', 'Evidence')}</span>${esc(PRINT ? q.why[0] + ' / ' + q.why[1] : L(q.why[0], q.why[1]))}
      ${(q.src || []).length ? `<div style="margin-top:6px">${q.src.map(x => `<code>${esc(x)}</code>`).join(' ')}</div>` : ''}${q.run ? `<div style="margin-top:6px"><code>${esc(q.run)}</code></div>` : ''}</div></div></details>
  </article>`).join('')}</div>`;
}
$('#toc').insertAdjacentHTML('beforeend', (DATA.code && DATA.code.length ? `<a href="#code-index">${L('代码索引', 'Code index')}</a>` : '') + (DATA.sections && DATA.sections.length ? `<a href="#paper-map">${L('本集对应原文', 'Paper map')}</a>` : '') + (DATA.practice && DATA.practice.length ? `<a href="#practice">${L('练习', 'Practice')}</a>` : ''));
document.addEventListener('click', e => {
  const img = e.target.closest('.slide img'); if (!img) return;
  const z = document.createElement('div'); z.className = 'zoom'; z.innerHTML = `<img src="${img.src}" alt="">`; z.onclick = () => z.remove(); document.body.append(z);
});
addEventListener('keydown', e => { if (e.key === 'Escape') document.querySelector('.zoom')?.remove(); });
// highlight the chapter being read
const links = [...document.querySelectorAll('.toc a')];
const io = new IntersectionObserver(es => es.forEach(x => { if (!x.isIntersecting) return; links.forEach(a => a.classList.toggle('on', a.getAttribute('href') === '#' + x.target.id)); }), {rootMargin: '-20% 0px -70% 0px'});
document.querySelectorAll('.chap, .extra').forEach(s => io.observe(s));
</script>
</body>
</html>
